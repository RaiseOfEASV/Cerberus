# vuln-web: static SPA. Same origin as vuln-api (Traefik routes /api and
# /auth there), so the CSP allows nothing but 'self'. Root filesystem is
# read-only in Kubernetes; writable emptyDirs: /tmp, /var/cache/nginx.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # nginx: an add_header inside a location REPLACES the server-level ones,
    # so each location that sets its own header includes security.conf.
    include /etc/nginx/snippets/security.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Content-hashed bundles: cache forever; a missing one is a real 404,
    # never index.html (a stale index.html would otherwise render blank).
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security.conf;
    }

    # The entry point is always revalidated so a deploy's new bundles load.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security.conf;
    }

    location / {
        try_files $uri /index.html;
    }
}
