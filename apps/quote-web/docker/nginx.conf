# Replaces nginx-unprivileged's default.conf. Root filesystem is read-only
# in Kubernetes (Kyverno require-readonly-rootfs); the only writable paths
# are emptyDirs: /tmp (pid), /var/cache/nginx, and /run/quote-web.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Generated at container start from API_URL (docker-entrypoint.sh) -
    # never cached, so a promotion's new value is picked up immediately.
    location = /env-config.js {
        alias /run/quote-web/env-config.js;
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        try_files $uri /index.html;
    }
}
