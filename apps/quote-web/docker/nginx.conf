# Replaces nginx-unprivileged's default.conf. Root filesystem is read-only
# in Kubernetes (Kyverno require-readonly-rootfs); the only writable paths
# are emptyDirs: /tmp (pid), /var/cache/nginx, and /run/quote-web.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # nginx: an add_header inside a location REPLACES the server-level ones,
    # so every location that sets its own header repeats the security pair.

    # Generated at container start from API_URL (docker-entrypoint.sh) -
    # never cached, so a promotion's new value is picked up immediately.
    location = /env-config.js {
        alias /run/quote-web/env-config.js;
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # Content-hashed bundles: cache forever; a missing one is a real 404, never
    # index.html - otherwise a browser holding an old index.html gets HTML for
    # its old bundle URLs and renders a blank page after a deploy.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # The HTML entry point must always be revalidated, so a deploy's new
    # bundle references reach returning visitors. The SPA fallback below
    # redirects internally to this location, so routes get the same header.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location / {
        try_files $uri /index.html;
    }
}
