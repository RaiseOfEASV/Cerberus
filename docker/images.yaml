# Every third-party container image the repo uses, in one place.
# Design: docs/superpowers/specs/2026-11-21-image-catalog-design.md
#
# To change a version: edit tag + digest here, then run `just images-sync`,
# which rewrites every reference in the repo. PR CI runs `just images-check`
# (fails on any reference that disagrees with this file or isn't listed) and
# scans changed entries with Trivy. The prod vuln-scanner scans every entry
# nightly and files the results in Cerberoast.
#
# Fields:
#   image   repository as written in the repo (docker.io/ and library/ optional)
#   tag     human-readable version; "" for digest-only images
#   digest  manifest digest the tag is pinned to; "" = unresolvable (not scanned)
#   source  direct  - referenced in our manifests/values/scripts (kept in sync)
#           vm      - docker-compose on the bootstrap/Wazuh/headscale VMs (kept in sync)
#           build   - Dockerfile build or base stage (kept in sync)
#           chart   - pulled by an upstream Helm chart (version follows `charts`)
#           k3s     - bundled with k3s (version follows `k3s`)
#   status  active | inactive (in the repo but not deployed)
# Our own images (ghcr.io/raiseofeasv/*) are not listed: build.yml and
# deploy.yml pin them per environment.

