name: Renovate

# Self-hosted Renovate: bumps Go/npm dependencies, GitHub Actions and the
# image catalog (docker/images.yaml), configured by /renovate.json.
#
# Self-hosted (not the Mend app) so it can run `python3 tools/images.py sync`
# after a catalog bump: each PR then changes the catalog and every file that
# references the image, and passes `images-check` on its own.
#
# Runs as its own GitHub App (cerberus-renovate), so PRs and commits show
# as cerberus-renovate[bot] - not as a person, who then couldn't approve them.
# Secrets: RENOVATE_APP_ID and RENOVATE_APP_PRIVATE_KEY. App permissions:
# Contents, Pull requests, Issues, Workflows read/write; Checks, Commit
# statuses, Dependabot alerts read. A short-lived installation token is
# minted per run. Commits go through the GitHub API (platformCommit), so
# they are signed (Verified).

on:
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC, inside renovate.json's "before 6am on monday"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The repo's own tools/images.py runs inside Renovate's checkout of each
      # branch; the runner provides python3 + PyYAML.
      - name: Token for the cerberus-renovate app
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      - name: Commit identity of the app's bot user
        id: author
        run: |
          id=$(gh api "/users/${SLUG}%5Bbot%5D" --jq .id)
          echo "git=${SLUG}[bot] <${id}+${SLUG}[bot]@users.noreply.github.com>" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run Renovate
        run: npx --yes renovate@44.257.9
        env:
          RENOVATE_TOKEN: ${{ steps.app.outputs.token }}
          RENOVATE_GIT_AUTHOR: ${{ steps.author.outputs.git }}
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
          RENOVATE_PLATFORM_COMMIT: enabled
          # The only command a repo config may run after an update.
          RENOVATE_ALLOWED_COMMANDS: '["^python3 tools/images\\.py sync$"]'
          LOG_LEVEL: info
