name: Base Images

# Builds, scans, signs, and publishes the central base images under
# docker/base/. Runs on GitHub-hosted runners deliberately - unlike the
# app pipelines (Epic 3), this needs no private network access, since it
# only pulls public upstream base images and pushes to GHCR.
#
# Action refs below use tags, not pinned SHAs - Renovate (renovate.json,
# github-actions manager, pinDigests: true) will open a PR converting them
# to pinned SHAs as soon as this file merges. Don't hand-pin them here.

on:
  push:
    branches: [main]
    paths:
      - "docker/base/**"
      - ".github/workflows/base-images.yml"
  schedule:
    # Weekly - catches a Renovate-driven upstream digest bump even when
    # nothing else in the Dockerfile changed, so a new CVE fix upstream
    # actually reaches our published base image.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  id-token: write # required for cosign keyless signing via GitHub OIDC

env:
  REGISTRY: ghcr.io
  OWNER: raiseofeasv

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [go, node]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (local, not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: docker/base/${{ matrix.image }}
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/base-${{ matrix.image }}:${{ github.sha }}

      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.OWNER }}/base-${{ matrix.image }}:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom-${{ matrix.image }}.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.image }}
          path: sbom-${{ matrix.image }}.cdx.json

      - name: Scan (Trivy) - fail on critical before anything gets pushed
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.OWNER }}/base-${{ matrix.image }}:${{ github.sha }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: docker/base/${{ matrix.image }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/base-${{ matrix.image }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.OWNER }}/base-${{ matrix.image }}:latest

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless, recorded in Rekor)
        run: |
          cosign sign --yes \
            "${REGISTRY}/${OWNER}/base-${IMAGE}@${DIGEST}"
        env:
          REGISTRY: ${{ env.REGISTRY }}
          OWNER: ${{ env.OWNER }}
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.push.outputs.digest }}

      - name: Attach SBOM attestation
        run: |
          cosign attest --yes \
            --predicate "sbom-${IMAGE}.cdx.json" \
            --type cyclonedx \
            "${REGISTRY}/${OWNER}/base-${IMAGE}@${DIGEST}"
        env:
          REGISTRY: ${{ env.REGISTRY }}
          OWNER: ${{ env.OWNER }}
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
