name: Deploy

# Never runs kubectl/helm against a cluster directly - CI holds no cluster
# credentials, period. This only edits the GitOps config that ArgoCD
# watches - the per-app, per-environment Helm values file
# (infra/helm/<app>/values-<env>.yaml, consumed by the Applications in
# infra/k8s/environments/<env>/) - and ArgoCD does the actual apply, from
# inside the cluster, under its own credentials.
#
# The `environment` input uses the repo's real directory/namespace names
# (staging, prod). The GitHub Environment gating the job maps `prod` to
# `production` (infra/terraform/github/environments.tf - required reviewer,
# deployments from master only); a bare `prod` would silently auto-create a new,
# unprotected environment and bypass that reviewer.
#
# master is protected (infra/terraform/github main_protection: PR + review +
# signed commits; nobody can push directly), so this workflow never pushes to
# it. It creates the bump commit on a new deploy/* branch through the GitHub
# API - commits made that way by GITHUB_TOKEN are signed by GitHub and show
# as Verified - and opens a pull request; once it merges, ArgoCD picks the
# change up from master. For prod there are two gates: the `production`
# environment approval (before this job runs) and the PR merge.
#
# They are NOT two-person control: the PR's author is github-actions[bot],
# so the person who dispatched the run may approve it as a code owner, repo
# admins may merge without review (ruleset bypass), and the environment has a
# single reviewer. One admin can promote to prod alone - a deliberate choice
# for a three-person team. For real two-person control: add reviewers to
# var.production_reviewers, set prevent_self_review on the environment, and
# drop the admin bypass.
#
# Needs the repo setting "Allow GitHub Actions to create and approve pull
# requests" (Settings > Actions > General > Workflow permissions).
#
# PRs opened with GITHUB_TOKEN don't trigger other workflows, so pr-validate
# doesn't run on them. Fine while required-status-checks is evaluate-only;
# flipping it to active needs a GitHub App token here instead.
#
# dev isn't an option here: dev's tag is changed by a normal PR, and dev
# auto-syncs. prod's Applications are manual-sync in ArgoCD, so after the
# prod bump PR merges, sync quote-*-prod deliberately.

on:
  workflow_dispatch:
    inputs:
      app:
        description: App to deploy (directory name under apps/)
        required: true
        type: string
      version:
        description: Image tag to deploy (e.g. v1.2.3 or a commit SHA)
        required: true
        type: string
      environment:
        description: Target environment
        required: true
        type: choice
        options: [staging, prod]

permissions:
  contents: write # create the deploy/* branch and its commit
  pull-requests: write # open the PR

# Serialize runs so promotions dispatched back to back are created in order.
concurrency:
  group: deploy-gitops
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  OWNER: raiseofeasv

jobs:
  update-gitops-config:
    name: update-gitops-config
    # TEMPORARY (Epic 3 deferred): ubuntu-latest until the ARC runner pool
    # (arc-runner-set) is deployed.
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment == 'prod' && 'production' || inputs.environment }}
    steps:
      - name: Only promote from master
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/master" ]; then
            echo "::error::run this workflow from master (got ${GITHUB_REF})" >&2; exit 1
          fi

      - uses: actions/checkout@v4

      - name: Bump image tag and digest in the GitOps config for this environment
        id: bump
        # yq (mikefarah v4) and docker buildx are preinstalled on
        # ubuntu-latest runners. Images are public, so no registry login.
        run: |
          # Inputs are free text - reject anything that isn't a plain
          # app name / image tag before it reaches a path or a values file.
          if ! printf '%s' "$APP" | grep -Eq '^[a-z0-9][a-z0-9-]*$'; then
            echo "::error::invalid app name: ${APP}" >&2; exit 1
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$' || [ "$VERSION" = "latest" ]; then
            echo "::error::invalid image tag: ${VERSION}" >&2; exit 1
          fi
          target="infra/helm/${APP}/values-${ENVIRONMENT}.yaml"
          if [ ! -f "$target" ]; then
            echo "::error::${target} doesn't exist - ${APP} isn't wired into ${ENVIRONMENT} (see infra/k8s/environments/${ENVIRONMENT}/)." >&2
            exit 1
          fi
          # Pin the tag to its manifest digest - the same digest Kyverno's
          # verify-image-signatures resolves at admission - so git matches
          # what runs and the deploy references an immutable image. Fails if
          # the tag doesn't exist (e.g. never built by build.yml).
          ref="${REGISTRY}/${OWNER}/${APP}:${VERSION}"
          DIGEST=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' | jq -r .digest)
          if ! printf '%s' "$DIGEST" | grep -Eq '^sha256:[a-f0-9]{64}$'; then
            echo "::error::couldn't resolve a digest for ${ref}" >&2; exit 1
          fi
          export DIGEST
          yq -i '.image.tag = strenv(VERSION) | .image.digest = strenv(DIGEST)' "$target"
          echo "Set ${APP} to ${VERSION}@${DIGEST} in ${target}"
          {
            echo "target=${target}"
            echo "digest=${DIGEST}"
          } >> "$GITHUB_OUTPUT"
        env:
          APP: ${{ inputs.app }}
          VERSION: ${{ inputs.version }}
          ENVIRONMENT: ${{ inputs.environment }}

      - name: Open a pull request with the change
        run: |
          if git diff --quiet -- "$TARGET"; then
            echo "${TARGET} already pins ${VERSION}@${DIGEST} - nothing to deploy."
            exit 0
          fi
          # Branch from exactly the commit this job checked out and edited,
          # so the PR diff is only this bump (a conflict shows on the PR if
          # master changed the same lines meanwhile).
          base_sha=$(git rev-parse HEAD)
          branch="deploy/${APP}-${ENVIRONMENT}-${VERSION:0:12}-${GITHUB_RUN_ID}"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/heads/${branch}" -f sha="${base_sha}" >/dev/null
          # Contents API commit: authored by github-actions[bot] and signed
          # by GitHub (Verified), which main_protection's required_signatures
          # accepts.
          blob_sha=$(git rev-parse "HEAD:${TARGET}")
          message=$(printf '%s\n\n%s\n%s\n' \
            "deploy: ${APP} ${VERSION} to ${ENVIRONMENT}" \
            "Co-authored-by: Andrii Savchenko <109040480+andriiVIt@users.noreply.github.com>" \
            "Co-authored-by: Ionut Andrei Grosu <80783004+grosuionutandrei@users.noreply.github.com>")
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/${TARGET}" \
            -f message="${message}" \
            -f content="$(base64 -w0 "$TARGET")" \
            -f sha="${blob_sha}" \
            -f branch="${branch}" >/dev/null
          after_merge="ArgoCD auto-syncs ${ENVIRONMENT} after merge."
          if [ "$ENVIRONMENT" = "prod" ]; then
            after_merge="prod is manual-sync: after merge, sync \`${APP}-prod\` in ArgoCD."
          fi
          gh pr create --base master --head "$branch" \
            --title "deploy: ${APP} ${VERSION} to ${ENVIRONMENT}" \
            --body "$(printf '%s\n' \
              "Promotes **${APP}** to **${ENVIRONMENT}**:" \
              "" \
              "- tag \`${VERSION}\`" \
              "- digest \`${DIGEST}\`" \
              "" \
              "Opened by deploy.yml run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} (triggered by @${GITHUB_ACTOR})." \
              "${after_merge}")"
        env:
          GH_TOKEN: ${{ github.token }}
          APP: ${{ inputs.app }}
          VERSION: ${{ inputs.version }}
          ENVIRONMENT: ${{ inputs.environment }}
          TARGET: ${{ steps.bump.outputs.target }}
          DIGEST: ${{ steps.bump.outputs.digest }}
