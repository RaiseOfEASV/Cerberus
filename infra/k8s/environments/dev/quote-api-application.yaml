apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: quote-api-dev
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/RaiseOfEASV/Cerberus.git
      targetRevision: master
      path: infra/helm/charts/app
      helm:
        releaseName: quote-api
        valueFiles:
          - $values/infra/helm/quote-api/values-dev.yaml
    - repoURL: https://github.com/RaiseOfEASV/Cerberus.git
      targetRevision: master
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
