# Ingress into the staging namespace from the ADMIN Traefik only (VPN), on the
# apps' container port - layered on Kyverno's auto-generated default-deny.
# VulnMan's preview route itself is in vulnman.yaml. If this ever fails
# while Traefik logs a successful route, suspect the documented kube-router
# peer-selector delay (new pods' IPs are added to policy sets late) first.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-admin-traefik-ingress
  namespace: staging
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: traefik
    ports:
    - port: 8080
      protocol: TCP
