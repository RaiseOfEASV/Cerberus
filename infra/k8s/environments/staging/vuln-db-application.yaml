apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vuln-db-staging
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/RaiseOfEASV/Cerberus.git
      targetRevision: master
      path: infra/helm/charts/postgres
      helm:
        releaseName: vuln-db
        valueFiles:
          - $values/infra/helm/vuln-db/values-staging.yaml
    - repoURL: https://github.com/RaiseOfEASV/Cerberus.git
      targetRevision: master
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
