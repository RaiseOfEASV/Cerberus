apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vuln-db-prod
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/RaiseOfEASV/Cerberus.git
      targetRevision: master
      path: infra/helm/charts/postgres
      helm:
        releaseName: vuln-db
        valueFiles:
          - $values/infra/helm/vuln-db/values-prod.yaml
    - repoURL: https://github.com/RaiseOfEASV/Cerberus.git
      targetRevision: master
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: cerberoast
  # Deploys as soon as a prod bump PR merges - that PR already passed the
  # `production` approval and a review. Self-heal reverts drift; prune stays
  # off, so a sync never deletes prod resources on its own. root-prod
  # (routing, certificate, policies) stays manual.
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
