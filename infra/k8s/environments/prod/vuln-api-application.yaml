apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vuln-api-prod
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/RaiseOfEASV/Cerberus.git
      targetRevision: master
      path: infra/helm/charts/app
      helm:
        releaseName: vuln-api
        valueFiles:
          - $values/infra/helm/vuln-api/values-prod.yaml
    - repoURL: https://github.com/RaiseOfEASV/Cerberus.git
      targetRevision: master
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: cerberoast
