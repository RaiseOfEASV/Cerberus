# Now identity-gated via oauth2-proxy/Keycloak, same shape as
# infra/k8s/oauth2-proxy/ingressroutes.yaml's version for every other
# admin UI (that file still covers Grafana/Kibana/Dependency-Track, none
# deployed yet - this one can be folded back into it once they land).
#
# Plain port 80: argocd-server runs with --insecure (argocd-values.yaml) -
# TLS already terminates here at Traefik, so the backend hop is HTTP.

apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  entryPoints: [websecure]
  routes:
    # oauth2-proxy's own /oauth2/* paths need to reach oauth2-proxy
    # directly, with no forwardAuth/errors middleware - see
    # infra/k8s/vault/ingressroute.yaml for the full reasoning (hit this
    # for real: Keycloak's redirect back to /oauth2/callback got routed
    # through forwardAuth too, which found no session cookie yet and
    # looped it into a brand new login instead of completing the one in
    # progress). Higher priority than the catch-all rule below.
    - match: "Host(`argocd.admin.cerberus.internal`) && PathPrefix(`/oauth2`)"
      kind: Rule
      priority: 100
      services:
        - name: oauth2-proxy
          namespace: oauth2-proxy
          port: 80
    # ArgoCD's OWN native OIDC login (argocd-values.yaml's configs.cm.
    # oidc.config - separate from the oauth2-proxy gate, same "two
    # different layers" distinction as Vault's /v1 carve-out) redirects
    # back here after Keycloak login. By the time this fires the user
    # already has an oauth2-proxy session (they had to pass the gate to
    # reach ArgoCD's login page and click "Log in via Keycloak" in the
    # first place), so this is lower-risk than Vault's case - carved out
    # anyway on the same principle: an OIDC callback exchanging a code
    # on ITS OWN auth flow shouldn't be gated by an unrelated session
    # check, to avoid the exact nested-redirect failure mode confirmed
    # for real on Vault/oauth2-proxy earlier.
    - match: "Host(`argocd.admin.cerberus.internal`) && PathPrefix(`/auth/callback`)"
      kind: Rule
      priority: 100
      services:
        - name: argocd-server
          port: 80
    - match: "Host(`argocd.admin.cerberus.internal`)"
      kind: Rule
      priority: 10
      # Deliberately NO oauth2-proxy-errors middleware - see
      # infra/k8s/vault/ingressroute.yaml for the full reasoning. An
      # unauthenticated request gets forwardAuth's own bare 401, not a
      # redirect that confirms this hostname is live and tells an
      # unauthenticated caller exactly which Keycloak realm fronts it.
      # Cost: nobody gets auto-redirected into login either - visiting
      # "/" directly no longer works for starting a session, only
      # /oauth2/start does.
      middlewares:
        - { name: oauth2-proxy-forwardauth, namespace: oauth2-proxy }
      services:
        - name: argocd-server
          port: 80
  tls:
    secretName: argocd-admin-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-admin-tls
  namespace: argocd
spec:
  secretName: argocd-admin-tls
  dnsNames: ["argocd.admin.cerberus.internal"]
  issuerRef: { name: cerberus-internal-ca, kind: ClusterIssuer }
