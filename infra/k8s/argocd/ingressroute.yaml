# Now identity-gated via oauth2-proxy/Keycloak, same shape as
# infra/k8s/oauth2-proxy/ingressroutes.yaml's version for every other
# admin UI (that file still covers Grafana/Kibana/Dependency-Track, none
# deployed yet - this one can be folded back into it once they land).
#
# Plain port 80: argocd-server runs with --insecure (argocd-values.yaml) -
# TLS already terminates here at Traefik, so the backend hop is HTTP.

apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  entryPoints: [websecure]
  routes:
    # oauth2-proxy's own /oauth2/* paths need to reach oauth2-proxy
    # directly, with no forwardAuth/errors middleware - see
    # infra/k8s/vault/ingressroute.yaml for the full reasoning (hit this
    # for real: Keycloak's redirect back to /oauth2/callback got routed
    # through forwardAuth too, which found no session cookie yet and
    # looped it into a brand new login instead of completing the one in
    # progress). Higher priority than the catch-all rule below.
    - match: "Host(`argocd.admin.cerberus.internal`) && PathPrefix(`/oauth2`)"
      kind: Rule
      priority: 100
      services:
        - name: oauth2-proxy
          namespace: oauth2-proxy
          port: 80
    - match: "Host(`argocd.admin.cerberus.internal`)"
      kind: Rule
      priority: 10
      # Traefik applies middlewares outermost-first, so the errors
      # middleware (which needs to catch forwardAuth's 401 response) has
      # to be listed BEFORE forwardAuth here, not after - see
      # infra/k8s/vault/ingressroute.yaml for how this was confirmed.
      middlewares:
        - { name: oauth2-proxy-errors, namespace: oauth2-proxy }
        - { name: oauth2-proxy-forwardauth, namespace: oauth2-proxy }
      services:
        - name: argocd-server
          port: 80
  tls:
    secretName: argocd-admin-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-admin-tls
  namespace: argocd
spec:
  secretName: argocd-admin-tls
  dnsNames: ["argocd.admin.cerberus.internal"]
  issuerRef: { name: cerberus-internal-ca, kind: ClusterIssuer }
