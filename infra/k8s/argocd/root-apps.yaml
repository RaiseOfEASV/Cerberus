# App-of-apps root: one ArgoCD Application per environment, each pointing
# at this same repo's infra/k8s/environments/<env>/ directory. ArgoCD
# watches these three; everything else (actual per-app Applications) gets
# added as children under those paths as real apps/*/ land - not created by
# hand one at a time.
#
# These are applied ONCE, manually (`kubectl apply -f root-apps.yaml`),
# after ArgoCD itself is installed - app-of-apps bootstraps itself but
# needs this one manual step to exist in the first place.
#
# Each environment directory holds a kustomization.yaml listing one child
# Application per app (multi-source: infra/helm/charts/app + that app's
# infra/helm/<app>/values-<env>.yaml). CreateNamespace=true because no
# dev/staging/prod namespace.yaml exists - Kyverno's
# enforce-namespace-baseline.yaml applies restricted PSA + default-deny to
# whatever namespace appears, same as every other namespace.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/RaiseOfEASV/Cerberus.git
    targetRevision: master
    path: infra/k8s/environments/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/RaiseOfEASV/Cerberus.git
    targetRevision: master
    path: infra/k8s/environments/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/RaiseOfEASV/Cerberus.git
    targetRevision: master
    path: infra/k8s/environments/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    # Deliberately NOT automated - production sync should go through the
    # same required-reviewer gate as everything else prod-facing (the
    # `production` GitHub Environment in deploy.yml controls what lands in
    # this path; ArgoCD auto-syncing on top of that would bypass the point
    # of that gate existing). Sync manually or via `argocd app sync root-prod`
    # as a deliberate action, not automatically on every git push.
    automated: null
    syncOptions:
      - CreateNamespace=true
