# Same internal CA cert as infra/k8s/oauth2-proxy/ca-configmap.yaml,
# duplicated here because ConfigMaps are namespace-scoped - ArgoCD's own
# native OIDC login (argocd-values.yaml's configs.cm.oidc.config) makes
# its own outbound call to Keycloak's discovery endpoint and hit the
# same "x509: certificate signed by unknown authority" oauth2-proxy and
# Vault both hit first. Just the public cert, no private key - safe to
# commit. See that file's header for the rotation procedure if this CA
# is ever reissued.
