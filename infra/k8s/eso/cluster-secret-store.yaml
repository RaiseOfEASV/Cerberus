# Cluster-wide: any namespace can reference this store by name in its own
# ExternalSecret, rather than each namespace needing its own SecretStore +
# Vault credentials. Auth is via Vault's kubernetes auth method (Epic 6
# Terraform) and the external-secrets ServiceAccount's own token - no
# static Vault token lives anywhere in this cluster.
#
# https + caBundle below reflect Epic 8 flipping Vault's TLS on
# (infra/helm/values/vault-values.yaml) - this was plain http in Epic 6,
# updated here rather than left stale now that Vault actually terminates
# TLS.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: "https://vault.vault.svc:8200"
      path: secret
      version: v2
      caProvider:
        type: Secret
        name: cerberus-internal-ca-secret
        namespace: cert-manager
        key: tls.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
