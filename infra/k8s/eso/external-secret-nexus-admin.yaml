# Closes the gap flagged in infra/nexus/provision.sh since Epic 2: that
# script needed NEXUS_USER/NEXUS_PASS from "somewhere secure," which didn't
# exist until now. Once this syncs, run provision.sh as a one-off Job in
# the nexus namespace with `envFrom: secretRef: {name: nexus-admin-credentials}`
# instead of a human exporting the vars by hand.
#
# Will fail to sync until `vault kv put secret/nexus/admin username=... password=...`
# has actually been run (infra/terraform/vault/README.md, step 3) - expected,
# not a bug, until that manual step happens.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: nexus-admin
  namespace: nexus
spec:
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: nexus-admin-credentials
  data:
    - secretKey: NEXUS_USER
      remoteRef: { key: nexus/admin, property: username }
    - secretKey: NEXUS_PASS
      remoteRef: { key: nexus/admin, property: password }
