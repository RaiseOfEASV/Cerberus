apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: dependency-track-db
  namespace: dependency-track
spec:
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: dependency-track-db
  data:
    - secretKey: username
      remoteRef: { key: dependency-track/db, property: username }
    - secretKey: password
      remoteRef: { key: dependency-track/db, property: password }
