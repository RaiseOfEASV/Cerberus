# Composes Velero's expected INI-format "cloud" credentials key from two
# separate Vault fields via ESO's templating - Velero's AWS-compatible
# plugin doesn't take raw access/secret keys directly, it reads an
# AWS-style credentials file.
#
# Will fail to sync until `vault kv put secret/backup/minio
# access_key=... secret_key=... endpoint=...` has been run (a DEDICATED
# backup-only MinIO user, not the root user - see infra/backups/README.md)
# - expected, not a bug, until that manual step happens.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: velero-minio
  namespace: velero
spec:
  secretStoreRef: { name: vault-backend, kind: ClusterSecretStore }
  refreshInterval: 1h
  target:
    name: velero-minio-credentials
    template:
      data:
        cloud: |
          [default]
          aws_access_key_id={{ .access_key }}
          aws_secret_access_key={{ .secret_key }}
  data:
    - secretKey: access_key
      remoteRef: { key: backup/minio, property: access_key }
    - secretKey: secret_key
      remoteRef: { key: backup/minio, property: secret_key }
