# Syncs the Vault client's own Keycloak secret into the keycloak
# namespace, for keycloak-apply-realm-config's Job to set it on the
# "vault" client (infra/keycloak/realm-config.yaml) - same cross-
# namespace pattern as external-secret-oauth2-proxy-client-for-keycloak.yaml,
# same reason (Secrets don't cross namespaces).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vault-oidc-client-for-keycloak
  namespace: keycloak
spec:
  secretStoreRef: { name: vault-backend, kind: ClusterSecretStore }
  refreshInterval: 1h
  target:
    name: vault-oidc-client-secret
  data:
    - secretKey: client-secret
      remoteRef: { key: oidc/vault-client, property: secret }
