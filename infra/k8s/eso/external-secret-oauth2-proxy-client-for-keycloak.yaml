# Kubernetes Secrets are namespace-scoped - infra/k8s/eso/
# external-secret-oauth2-proxy.yaml syncs the same Vault path
# (oauth2-proxy/client) into the oauth2-proxy namespace for the proxy
# itself, but infra/keycloak/apply-realm-config.yaml's Job runs in the
# keycloak namespace and needs this client's secret value too (to set it
# on the Keycloak side of the same OIDC client) - a cross-namespace
# secretKeyRef simply doesn't work, confirmed by the real
# CreateContainerConfigError ("secret oauth2-proxy-credentials not
# found") this produced before adding this second sync.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth2-proxy-client-for-keycloak
  namespace: keycloak
spec:
  secretStoreRef: { name: vault-backend, kind: ClusterSecretStore }
  refreshInterval: 1h
  target:
    name: oauth2-proxy-client-secret
  data:
    - secretKey: client-secret
      remoteRef: { key: oauth2-proxy/client, property: secret }
