# Closes the gap flagged in infra/helm/values/arc-runners-values.yaml since
# Epic 3: githubConfigSecret needed a GitHub App key from "nowhere secure
# to source from until Epic 6." Target name/keys below match exactly what
# the gha-runner-scale-set chart expects for GitHub App auth - don't rename
# either side without checking the other.
#
# Will fail to sync until `vault kv put secret/arc/github-app app_id=...
# installation_id=... private_key=@key.pem` has actually been run
# (infra/terraform/vault/README.md, step 3) - expected, not a bug, until
# that manual step happens.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: arc-runner-github-app
  namespace: arc-runners
spec:
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: arc-runner-github-app # must match arc-runners-values.yaml's githubConfigSecret
  data:
    - secretKey: github_app_id
      remoteRef: { key: arc/github-app, property: app_id }
    - secretKey: github_app_installation_id
      remoteRef: { key: arc/github-app, property: installation_id }
    - secretKey: github_app_private_key
      remoteRef: { key: arc/github-app, property: private_key }
