apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-admin
  namespace: keycloak
spec:
  secretStoreRef: { name: vault-backend, kind: ClusterSecretStore }
  refreshInterval: 1h
  target:
    name: keycloak-admin-credentials
  data:
    - secretKey: admin-user
      remoteRef: { key: keycloak/admin, property: username }
    - secretKey: admin-password
      remoteRef: { key: keycloak/admin, property: password }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-db
  namespace: keycloak
spec:
  secretStoreRef: { name: vault-backend, kind: ClusterSecretStore }
  refreshInterval: 1h
  target:
    name: keycloak-db-credentials
  data:
    - secretKey: postgres-password
      remoteRef: { key: keycloak/db, property: password }
