apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wazuh-agent
  namespace: wazuh-agent
spec:
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: wazuh-agent-credentials
  data:
    - secretKey: password
      remoteRef: { key: wazuh/agent, property: password }
