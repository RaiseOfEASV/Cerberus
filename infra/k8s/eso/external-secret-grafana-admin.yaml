# Will fail to sync until `vault kv put secret/grafana/admin
# username=admin password=...` has been run - same expected-until-populated
# pattern as the other ExternalSecrets in this directory.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: grafana-admin-credentials
  data:
    - secretKey: username
      remoteRef: { key: grafana/admin, property: username }
    - secretKey: password
      remoteRef: { key: grafana/admin, property: password }
