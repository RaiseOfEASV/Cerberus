# Two syncs of the same Vault value, for two different consumers:
# keycloak-apply-realm-config's Job (sets the secret on the "argocd"
# client, infra/keycloak/realm-config.yaml) and ArgoCD's own argocd-cm
# oidc.config, which references a key on the chart's own argocd-secret
# Secret via ArgoCD's "$argocd-secret:key" convention - creationPolicy:
# Merge so this ADDS a key to that existing, chart-owned Secret instead
# of fighting it for ownership of the whole object.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-oidc-client-for-keycloak
  namespace: keycloak
spec:
  secretStoreRef: { name: vault-backend, kind: ClusterSecretStore }
  refreshInterval: 1h
  target:
    name: argocd-oidc-client-secret
  data:
    - secretKey: client-secret
      remoteRef: { key: oidc/argocd-client, property: secret }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-oidc-client-for-argocd
  namespace: argocd
spec:
  secretStoreRef: { name: vault-backend, kind: ClusterSecretStore }
  refreshInterval: 1h
  target:
    name: argocd-secret
    creationPolicy: Merge
  data:
    - secretKey: oidc.keycloak.clientSecret
      remoteRef: { key: oidc/argocd-client, property: secret }
