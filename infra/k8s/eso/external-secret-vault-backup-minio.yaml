# Same Vault path as external-secret-velero-minio.yaml, synced into the
# `vault` namespace with plain (non-templated) keys instead - the Vault
# backup CronJob composes its own MC_HOST_backup URL at runtime rather
# than needing Velero's AWS-INI format.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vault-backup-minio
  namespace: vault
spec:
  secretStoreRef: { name: vault-backend, kind: ClusterSecretStore }
  refreshInterval: 1h
  target:
    name: vault-backup-minio-credentials
  data:
    - secretKey: access-key
      remoteRef: { key: backup/minio, property: access_key }
    - secretKey: secret-key
      remoteRef: { key: backup/minio, property: secret_key }
    - secretKey: endpoint
      remoteRef: { key: backup/minio, property: endpoint }
