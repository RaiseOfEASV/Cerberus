# Syncs the Cloudflare DNS-01 API token into the cert-manager namespace,
# for letsencrypt-public's ClusterIssuer (infra/k8s/cert-manager/
# cluster-issuers.yaml) to use. The token value itself is written
# directly to Vault by hand, same "secrets never through Terraform/
# generated files" pattern as everything else:
#   vault kv put secret/cloudflare/api-token api-token=<...>
# Must be scoped to Zone:DNS:Edit on cerberoast.site ONLY - never a
# global/account-wide Cloudflare API token.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
spec:
  secretStoreRef: { name: vault-backend, kind: ClusterSecretStore }
  refreshInterval: 1h
  target:
    name: cloudflare-api-token
  data:
    - secretKey: api-token
      remoteRef: { key: cloudflare/api-token, property: api-token }
