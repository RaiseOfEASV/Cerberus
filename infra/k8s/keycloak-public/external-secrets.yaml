# Values live in Vault only (written by hand, see README.md).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-public-admin
  namespace: keycloak-public
spec:
  secretStoreRef: { name: vault-backend, kind: ClusterSecretStore }
  refreshInterval: 1h
  target: { name: keycloak-public-admin-credentials }
  data:
    - { secretKey: admin-user, remoteRef: { key: keycloak-public/admin, property: username } }
    - { secretKey: admin-password, remoteRef: { key: keycloak-public/admin, property: password } }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-public-db
  namespace: keycloak-public
spec:
  secretStoreRef: { name: vault-backend, kind: ClusterSecretStore }
  refreshInterval: 1h
  target: { name: keycloak-public-db-credentials }
  data:
    - { secretKey: postgres-password, remoteRef: { key: keycloak-public/db, property: password } }
---
# Client secrets the realm-config Job writes into Keycloak; vuln-api reads
# the same values in its own namespace (infra/k8s/environments/*/vulnman.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-public-client-secrets
  namespace: keycloak-public
spec:
  secretStoreRef: { name: vault-backend, kind: ClusterSecretStore }
  refreshInterval: 1h
  target: { name: keycloak-public-client-secrets }
  data:
    - { secretKey: VULN_DEV_OIDC_SECRET, remoteRef: { key: vulnman/dev/oidc, property: client_secret } }
    - { secretKey: VULN_DEV_ADMIN_SECRET, remoteRef: { key: vulnman/dev/kc-admin, property: client_secret } }
    - { secretKey: VULN_STAGING_OIDC_SECRET, remoteRef: { key: vulnman/staging/oidc, property: client_secret } }
    - { secretKey: VULN_STAGING_ADMIN_SECRET, remoteRef: { key: vulnman/staging/kc-admin, property: client_secret } }
    - { secretKey: VULN_PROD_OIDC_SECRET, remoteRef: { key: vulnman/prod/oidc, property: client_secret } }
    - { secretKey: VULN_PROD_ADMIN_SECRET, remoteRef: { key: vulnman/prod/kc-admin, property: client_secret } }
