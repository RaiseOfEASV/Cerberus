# Kubernetes API audit policy for the k3s node. k3s ships with API auditing
# off; README.md in this directory has the manual steps to turn it on.
#
# The aim is "who did what to the cluster" during the pentest without
# filling the 29 GiB node disk: metadata (user, verb, resource, source IP,
# response code) for almost everything, request bodies only where they show
# intent (exec/attach/port-forward and RBAC changes), and never the contents
# of Secrets, ConfigMaps or tokens.
apiVersion: audit.k8s.io/v1
kind: Policy
omitStages:
  - RequestReceived
rules:
  # High-volume, low-value read traffic from the control plane and nodes.
  - level: None
    users: ["system:kube-proxy", "system:apiserver"]
  - level: None
    userGroups: ["system:nodes"]
    verbs: ["get", "list", "watch"]
  - level: None
    verbs: ["watch"]
  - level: None
    resources:
      - group: "coordination.k8s.io"
        resources: ["leases"]
      - group: ""
        resources: ["events"]
  - level: None
    nonResourceURLs: ["/healthz*", "/livez*", "/readyz*", "/version", "/openapi*", "/metrics"]

  # Never log the payload of anything that can hold a secret.
  - level: Metadata
    resources:
      - group: ""
        resources: ["secrets", "configmaps", "serviceaccounts/token"]
      - group: "authentication.k8s.io"
        resources: ["tokenreviews"]

  # Shells and tunnels into pods: keep the request (command, container).
  - level: Request
    resources:
      - group: ""
        resources: ["pods/exec", "pods/attach", "pods/portforward", "pods/proxy", "services/proxy"]

  # Permission changes: keep the request body.
  - level: Request
    verbs: ["create", "update", "patch", "delete"]
    resources:
      - group: "rbac.authorization.k8s.io"

  # Everything else: who, what, when, from where, and the result.
  - level: Metadata
