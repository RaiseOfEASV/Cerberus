# Kubernetes API audit policy for the k3s node. k3s ships with API auditing
# off; README.md in this directory has the manual steps to turn it on.
#
# The aim is "who did what to the cluster" during the pentest without
# filling the 29 GiB node disk: metadata (user, verb, resource, source IP,
# response code) for almost everything, request bodies only where they show
# intent (exec/attach/port-forward and RBAC changes), and never the contents
# of Secrets, ConfigMaps or tokens.
apiVersion: audit.k8s.io/v1
kind: Policy
omitStages:
  - RequestReceived
rules:
  # High-volume, low-value read traffic from the control plane and nodes.
  - level: None
    users: ["system:kube-proxy", "system:apiserver"]
  - level: None
    userGroups: ["system:nodes"]
    verbs: ["get", "list", "watch"]
  - level: None
    verbs: ["watch"]
  # Reads by named control-plane and Kyverno components (measured at about
  # 2 MB/min before this rule). Only these exact accounts: a stolen token of
  # any other service account still has its reads logged.
  - level: None
    verbs: ["get", "list"]
    users:
      - "system:kube-controller-manager"
      - "system:kube-scheduler"
      - "system:serviceaccount:kube-system:generic-garbage-collector"
      - "system:serviceaccount:kube-system:resourcequota-controller"
      - "system:serviceaccount:kube-system:namespace-controller"
      - "system:serviceaccount:kyverno:kyverno-reports-controller"
      - "system:serviceaccount:kyverno:kyverno-background-controller"
      - "system:serviceaccount:kyverno:kyverno-cleanup-controller"
      - "system:serviceaccount:kyverno:kyverno-admission-controller"
      - "system:serviceaccount:argocd:argocd-application-controller"
      - "system:k3s-supervisor"
  # Kyverno's own policy reports, rewritten constantly.
  - level: None
    resources:
      - group: "wgpolicyk8s.io"
      - group: "reports.kyverno.io"
      - group: "kyverno.io"
        resources: ["updaterequests", "ephemeralreports", "clusterephemeralreports"]
  # Kyverno's cleanup controller checks its own permissions in a loop.
  - level: None
    users: ["system:serviceaccount:kyverno:kyverno-cleanup-controller"]
    resources:
      - group: "authorization.k8s.io"
        resources: ["selfsubjectaccessreviews"]
  - level: None
    resources:
      - group: "coordination.k8s.io"
        resources: ["leases"]
      - group: ""
        resources: ["events"]
  - level: None
    nonResourceURLs: ["/healthz*", "/livez*", "/readyz*", "/version", "/openapi*", "/metrics"]

  # Never log the payload of anything that can hold a secret.
  - level: Metadata
    resources:
      - group: ""
        resources: ["secrets", "configmaps", "serviceaccounts/token"]
      - group: "authentication.k8s.io"
        resources: ["tokenreviews"]

  # Shells and tunnels into pods: keep the request (command, container).
  - level: Request
    resources:
      - group: ""
        resources: ["pods/exec", "pods/attach", "pods/portforward", "pods/proxy", "services/proxy"]

  # Permission changes: keep the request body.
  - level: Request
    verbs: ["create", "update", "patch", "delete"]
    resources:
      - group: "rbac.authorization.k8s.io"

  # Everything else: who, what, when, from where, and the result.
  - level: Metadata
