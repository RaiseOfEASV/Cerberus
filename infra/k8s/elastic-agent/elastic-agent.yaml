# Elastic Agent (Fleet-managed) shipping the cluster's logs to the Elastic
# Cloud trial used during the external pentest. Fleet holds the actual
# collection config (agent policy with the Kubernetes and System
# integrations); this only runs the agent on the node.
#
# Trimmed from Elastic's generated manifest (Fleet > Add agent > Kubernetes),
# which runs in kube-system with hostNetwork and mounts /etc, /var/lib, /boot,
# /sys/kernel/debug and the BPF filesystem for integrations not used here
# (Defend for Containers, CSPM, Universal Profiling). Kept: read-only /var/log
# (container logs under /var/log/pods and /var/log/containers, the k3s API
# audit log under /var/log/kubernetes/audit), machine-id and a state directory.
# No host /proc or cgroups (Trivy KSV-0121): the System integration only reads
# them when the policy sets system.hostfs, which it doesn't; host-level
# metrics for the bootstrap VM come from node_exporter (infra/node-exporter/).
#
# Runs as UID 0 because the pod log files (0640) and the audit log directory
# (0700) are root-only on the node, but with every capability dropped, no
# privilege escalation and a read-only root filesystem.
#
# Namespace `monitoring`: it is on Kyverno's exclusion list for the
# restricted-PSA labels (hostPath mounts are not allowed under restricted).
#
# Secrets: FLEET_URL and FLEET_ENROLLMENT_TOKEN come from Vault
# (secret/elastic/cloud: url, secret) through ESO. Needs the
# eso-read policy to include secret/data/elastic/* (infra/terraform/vault).
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: elastic-agent
  namespace: monitoring
spec:
  secretStoreRef: { name: vault-backend, kind: ClusterSecretStore }
  refreshInterval: 1h
  target: { name: elastic-agent-fleet }
  data:
    - { secretKey: FLEET_URL, remoteRef: { key: elastic/cloud, property: url } }
    - { secretKey: FLEET_ENROLLMENT_TOKEN, remoteRef: { key: elastic/cloud, property: secret } }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: elastic-agent
  namespace: monitoring
  labels: { app.kubernetes.io/name: elastic-agent }
---
# Read-only metadata the Kubernetes integration uses to label logs and
# metrics with pod, namespace, workload and node. No secrets, no RBAC objects.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: elastic-agent
  labels: { app.kubernetes.io/name: elastic-agent }
rules:
  - apiGroups: [""]
    resources: [nodes, namespaces, events, pods, services, persistentvolumes, persistentvolumeclaims]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [statefulsets, deployments, replicasets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [nodes/stats]
    verbs: [get]
  - nonResourceURLs: ["/metrics"]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: elastic-agent
subjects:
  - { kind: ServiceAccount, name: elastic-agent, namespace: monitoring }
roleRef: { kind: ClusterRole, name: elastic-agent, apiGroup: rbac.authorization.k8s.io }
---
# Leader election between agents (one per node).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: elastic-agent
  namespace: monitoring
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, create, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: elastic-agent
  namespace: monitoring
subjects:
  - { kind: ServiceAccount, name: elastic-agent, namespace: monitoring }
roleRef: { kind: Role, name: elastic-agent, apiGroup: rbac.authorization.k8s.io }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: elastic-agent
  namespace: monitoring
  labels: { app.kubernetes.io/name: elastic-agent }
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: elastic-agent }
  template:
    metadata:
      labels: { app.kubernetes.io/name: elastic-agent }
    spec:
      serviceAccountName: elastic-agent
      # GID 4 = adm on Ubuntu: /var/log/auth.log and syslog are syslog:adm 0640.
      # A group is narrower than giving back CAP_DAC_OVERRIDE.
      securityContext:
        supplementalGroups: [4]
      tolerations:
        - { key: node-role.kubernetes.io/control-plane, effect: NoSchedule }
        - { key: node-role.kubernetes.io/master, effect: NoSchedule }
      containers:
        - name: elastic-agent
          image: docker.elastic.co/elastic-agent/elastic-agent:9.5.6@sha256:0852ec96b475d64a70d28644c4d898bd2c913d9962b3323998aa77f27e5393e5
          envFrom:
            - secretRef: { name: elastic-agent-fleet }
          env:
            - { name: FLEET_ENROLL, value: "1" }
            - { name: FLEET_INSECURE, value: "false" }
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - { name: ELASTIC_NETINFO, value: "false" }
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 100m, memory: 500Mi }
            limits: { cpu: 500m, memory: 1200Mi }
          volumeMounts:
            - { name: varlog, mountPath: /var/log, readOnly: true }
            - { name: machine-id, mountPath: /etc/machine-id, readOnly: true }
            - { name: state, mountPath: /usr/share/elastic-agent/state }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: varlog, hostPath: { path: /var/log } }
        - { name: machine-id, hostPath: { path: /etc/machine-id, type: File } }
        - name: state
          hostPath: { path: /var/lib/elastic-agent-managed/monitoring/state, type: DirectoryOrCreate }
        - { name: tmp, emptyDir: {} }
