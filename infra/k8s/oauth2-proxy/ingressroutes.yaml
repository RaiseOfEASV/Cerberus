      middlewares: [{ name: oauth2-proxy-forwardauth, namespace: oauth2-proxy }]
      services: [{ name: argocd-server, port: 80 }]
  tls:
    secretName: argocd-admin-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
