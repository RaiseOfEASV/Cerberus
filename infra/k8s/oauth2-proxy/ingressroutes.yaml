# NOTE: Wazuh dashboard is deliberately NOT in this cluster (infra/wazuh/
# runs on its own dedicated host, separate on purpose - see that
# directory's header). It can't get a Traefik IngressRoute here. Its
# network-layer gate is already handled (loopback-only + headscale reaches
# that host directly); its identity-layer gate would need either a
# standalone oauth2-proxy + reverse-proxy pair on that same host, or
# exposing it through this cluster's Traefik some other way - NOT solved
# here, flagged as a real gap rather than silently covered by this file's
# name implying otherwise.
