# One IngressRoute per admin UI, each applying oauth2-proxy-forwardauth
# and getting its cert from the internal CA (Epic 8's cert-manager). This
# SUPERSEDES the "ClusterIP only, reach via kubectl port-forward" note
# written into each of these services' own values files/READMEs back in
# Epics 4/6/7 - that was correct for its time (no VPN/identity layer
# existed yet to do anything safer), and this is what replaces it.
#
# Hostnames must exactly match infra/headscale/config/config.yaml's
# extra_records and infra/keycloak/realm-config.yaml's redirectUris - all
# three were written together, keep them that way if the domain changes.
#
# NOT YET APPLIABLE: needs every backend service it references already
# deployed (Vault, ArgoCD, Grafana, Wazuh dashboard - which is NOT in this
# cluster, see the caveat on wazuh.admin below, Kibana, Dependency-Track),
# plus cert-manager and oauth2-proxy.

apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: vault
  namespace: vault
spec:
  entryPoints: [websecure]
  routes:
    - match: "Host(`vault.admin.cerberus.internal`)"
      kind: Rule
      middlewares: [{ name: oauth2-proxy-forwardauth, namespace: oauth2-proxy }]
      services: [{ name: vault-ui, port: 8200 }]
  tls:
    secretName: vault-admin-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault-admin-tls
  namespace: vault
spec:
  secretName: vault-admin-tls
  dnsNames: ["vault.admin.cerberus.internal"]
  issuerRef: { name: cerberus-internal-ca, kind: ClusterIssuer }
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd
  namespace: argocd
spec:
