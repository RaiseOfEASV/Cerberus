# Traefik Middleware CRDs - this is what actually wires every admin UI's
# IngressRoute to the shared oauth2-proxy instance. Each IngressRoute
# (vault's, argocd's, keycloak's isn't - it has its own login) references
# BOTH middlewares by name, in order.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: oauth2-proxy-forwardauth
  namespace: oauth2-proxy
spec:
  forwardAuth:
    address: "http://oauth2-proxy.oauth2-proxy.svc:80/oauth2/auth"
    trustForwardHeader: true
    authResponseHeaders:
      - X-Auth-Request-User
      - X-Auth-Request-Email
      - Authorization
---
# /oauth2/auth (above) is the forward-auth CHECK endpoint - by design it
# returns a bare 401 on no session, with no redirect of its own (confirmed
# directly: a real unauthenticated request got back a 401 with no
# Location header at all).
#
# DELIBERATELY NOT an auto-redirect - this was built that way once
# (querying /oauth2/start with statusRewrites forcing a real 302), then
# reverted: an auto-redirect to Keycloak confirms to anyone who can
# merely reach the hostname, authenticated or not, that it's live and
# exactly which Keycloak realm fronts it. Querying /oauth2/sign_in
# instead gives a real, styled page with a "Sign in with Keycloak OIDC"
# button the user has to click - same-origin, no information in a
# Location header, status stays a genuine 401 (no statusRewrites) since
# the body is real content for a human to act on, not an empty redirect
# target. Clicking the button still goes to /oauth2/start, same flow as
# always, just not automatic.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: oauth2-proxy-errors
  namespace: oauth2-proxy
spec:
  errors:
    status: ["401-403"]
    query: "/oauth2/sign_in?rd={url}"
    service:
      name: oauth2-proxy
      port: 80
