# Traefik Middleware CRD - this is what actually wires every admin UI's
# IngressRoute to the shared oauth2-proxy instance. Each IngressRoute in
# ingressroutes.yaml references this ONE middleware by name.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: oauth2-proxy-forwardauth
  namespace: oauth2-proxy
spec:
  forwardAuth:
    address: "http://oauth2-proxy.oauth2-proxy.svc:80/oauth2/auth"
    trustForwardHeader: true
    authResponseHeaders:
      - X-Auth-Request-User
      - X-Auth-Request-Email
      - Authorization
