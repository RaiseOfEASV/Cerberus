# Traefik Middleware CRDs - this is what actually wires every admin UI's
# IngressRoute to the shared oauth2-proxy instance. Each IngressRoute
# (vault's, argocd's, keycloak's isn't - it has its own login) references
# BOTH middlewares by name, in order.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: oauth2-proxy-forwardauth
  namespace: oauth2-proxy
spec:
  forwardAuth:
    address: "http://oauth2-proxy.oauth2-proxy.svc:80/oauth2/auth"
    trustForwardHeader: true
    authResponseHeaders:
      - X-Auth-Request-User
      - X-Auth-Request-Email
      - Authorization
---
# /oauth2/auth (above) is the forward-auth CHECK endpoint - by design it
# returns a bare 401 on no session, with no redirect of its own (confirmed
# directly: a real unauthenticated request got back a 401 with no
# Location header at all). This catches that 401 and queries oauth2-
# proxy's real sign-in flow (/oauth2/start), which does produce a 302 to
# Keycloak - but Traefik's errors middleware, without statusRewrites,
# preserves the ORIGINAL triggering status (401) while substituting the
# error-service's body/headers. A real browser doesn't auto-navigate a
# 401+Location (confirmed hitting this live - the user got a raw "<a
# href=...>Found</a>" link, not a redirect), so statusRewrites below
# forces the client-facing status to a real 302, which Traefik v3.5+
# supports on this exact middleware for exactly this case.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: oauth2-proxy-errors
  namespace: oauth2-proxy
spec:
  errors:
    status: ["401-403"]
    statusRewrites:
      "401-403": 302
    query: "/oauth2/start?rd={url}"
    service:
      name: oauth2-proxy
      port: 80
