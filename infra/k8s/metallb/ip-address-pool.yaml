# TODO before applying: the CIDR below is a PLACEHOLDER, not a real value -
# don't apply this as-is. On a kind cluster, find the real range with:
#
#   docker network inspect kind | jq -r '.[0].IPAM.Config[0].Subnet'
#
# and pick a small, unused slice near the top of that subnet (kind assigns
# node IPs from the bottom). On k3d or a real bare-metal network, the range
# must be reachable from wherever you're running `kubectl`/`curl` against
# Traefik's resulting external IP, and must not collide with DHCP.

apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: cerberus-pool
  namespace: metallb-system
spec:
  addresses:
    - 172.18.255.200-172.18.255.250 # PLACEHOLDER - see above, confirm against your actual kind network
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: cerberus-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - cerberus-pool
