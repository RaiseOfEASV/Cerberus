# Grafana Cloud Fleet Management credentials for the Alloy collectors
# (infra/helm/values/grafana-k8s-monitoring-values.yaml). Vault
# secret/grafana/cloud: username = the Fleet Management user id, password = a
# Grafana Cloud access policy token. eso-read already covers secret/data/grafana/*.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-cloud-fleet
  namespace: monitoring
spec:
  secretStoreRef: { name: vault-backend, kind: ClusterSecretStore }
  refreshInterval: 1h
  target: { name: grafana-cloud-fleet }
  data:
    - { secretKey: username, remoteRef: { key: grafana/cloud, property: username } }
    - { secretKey: password, remoteRef: { key: grafana/cloud, property: password } }
