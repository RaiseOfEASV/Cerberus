# Placeholder content only - proves DNS -> TLS -> NSG -> Traefik all
# work end to end on cerberoast.site before any real app exists. Swap
# this ConfigMap (and the Deployment it's mounted into) for a real app
# when one exists; nothing else in this directory needs to change.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cerberoast-placeholder-html
  namespace: cerberoast
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
      <head>
        <meta charset="utf-8" />
        <title>Cerberoast</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <style>
          body { background: #0d1117; color: #e6edf3; font-family: system-ui, sans-serif;
                 display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
          main { text-align: center; }
          h1 { font-size: 2.5rem; margin-bottom: 0.25rem; }
          p { color: #8b949e; }
        </style>
      </head>
      <body>
        <main>
          <h1>Cerberoast</h1>
          <p>Coming soon.</p>
        </main>
      </body>
    </html>
