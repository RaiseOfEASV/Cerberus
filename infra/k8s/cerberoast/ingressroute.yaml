# cerberoast.site = VulnMan (plan docs/superpowers/plans/2026-11-16-vulnman.md,
# D1). One origin: /api and /auth -> vuln-api (no prefix strip), everything
# else -> vuln-web. www redirects to the apex, because the session cookie
# and the OIDC callback are bound to PUBLIC_BASE_URL=https://cerberoast.site.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: www-to-apex
  namespace: cerberoast
  labels:
    traefik-instance: public
spec:
  redirectRegex:
    regex: "^https://www\\.cerberoast\\.site/(.*)"
    replacement: "https://cerberoast.site/${1}"
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: cerberoast
  namespace: cerberoast
  labels:
    traefik-instance: public
spec:
  entryPoints: [websecure]
  routes:
    - match: "Host(`www.cerberoast.site`)"
      kind: Rule
      priority: 200
      middlewares:
        - name: www-to-apex
      services:
        - name: vuln-web
          port: 80
    - match: "Host(`cerberoast.site`) && (PathPrefix(`/api`) || PathPrefix(`/auth`))"
      kind: Rule
      priority: 100
      services:
        - name: vuln-api
          port: 80
    - match: "Host(`cerberoast.site`)"
      kind: Rule
      services:
        - name: vuln-web
          port: 80
  tls:
    secretName: cerberoast-site-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cerberoast-site-tls
  namespace: cerberoast
spec:
  secretName: cerberoast-site-tls
  dnsNames: ["cerberoast.site", "www.cerberoast.site"]
  issuerRef: { name: letsencrypt-public, kind: ClusterIssuer }
