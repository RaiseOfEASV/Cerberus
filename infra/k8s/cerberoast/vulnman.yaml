# vuln-api's egress, on top of Kyverno's generated default-deny (Ingress
# and Egress): DNS, its own Postgres, Vault Transit, the public Keycloak's
# pods (back-channel: discovery, token, admin API). Nothing else - in
# particular no internet egress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vuln-api-egress
  namespace: cerberoast
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: vuln-api }
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
    - to:
        - podSelector: { matchLabels: { app.kubernetes.io/name: vuln-db, app.kubernetes.io/component: database } }
      ports: [{ port: 5432, protocol: TCP }]
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: vault } }
      ports: [{ port: 8200, protocol: TCP }]
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: keycloak-public } }
          podSelector: { matchLabels: { app.kubernetes.io/name: keycloakx } }
      ports: [{ port: 8080, protocol: TCP }]
