# VulnMan, prod: secrets, CA, egress.
# vuln-api's client secrets (same Vault values the realm-config Job writes
# into Keycloak - infra/k8s/keycloak-public/README.md).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vuln-api-oidc
  namespace: cerberoast
spec:
  secretStoreRef: { name: vault-backend, kind: ClusterSecretStore }
  refreshInterval: 1h
  target: { name: vuln-api-oidc }
  data:
    - { secretKey: OIDC_CLIENT_SECRET, remoteRef: { key: vulnman/prod/oidc, property: client_secret } }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vuln-api-kc-admin
  namespace: cerberoast
spec:
  secretStoreRef: { name: vault-backend, kind: ClusterSecretStore }
  refreshInterval: 1h
  target: { name: vuln-api-kc-admin }
  data:
    - { secretKey: KEYCLOAK_ADMIN_CLIENT_SECRET, remoteRef: { key: vulnman/prod/kc-admin, property: client_secret } }
---
