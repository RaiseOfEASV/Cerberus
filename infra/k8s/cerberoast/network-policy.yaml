# Layers one specific allow on top of Kyverno's auto-generated
# default-deny-all for this namespace (same pattern as vault/arc-runners)
# - ingress from traefik-public only. No egress rule at all: quote-web
# serves a static SPA and quote-api answers from memory - neither makes
# upstream calls (the browser calls api.cerberoast.site, not quote-web).
#
# Scoped by podSelector/namespaceSelector, not a fully-open rule - unlike
# several other namespaces in this cluster (vault, keycloak,
# oauth2-proxy), this hasn't yet hit the kube-router peer-selector
# unreliability documented in BACKLOG.local.md/infra/k8s/keycloak/
# network-policy.yaml. If ingress mysteriously fails despite Traefik
# logs showing a successful route, that known cluster-wide issue is the
# first thing to check - not a mistake in this file.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traefik-public-ingress
  namespace: cerberoast
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik-public
