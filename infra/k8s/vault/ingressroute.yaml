# Now identity-gated via oauth2-proxy/Keycloak, same shape as
# infra/k8s/oauth2-proxy/ingressroutes.yaml's version for every other
# admin UI (that file still covers Grafana/Kibana/Dependency-Track, none
# deployed yet - this one can be folded back into it once they land).
#
# scheme: https + the ServersTransport below: vault's own listener is
# TLS-only (no plain HTTP), so Traefik has to speak HTTPS to the backend
# too. insecureSkipVerify is a real, deliberate gap, not an oversight -
# Traefik has no CA bundle to validate vault-ui's cert against (it's
# issued by cerberus-internal-ca, in a different namespace). Acceptable
# for now because this hop never leaves the cluster's own pod network -
# revisit by giving the ServersTransport that CA via a synced secret if
# this needs tightening later.

apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: vault-backend-tls
  namespace: vault
spec:
  insecureSkipVerify: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: vault
  namespace: vault
spec:
  entryPoints: [websecure]
  routes:
    # oauth2-proxy's own /oauth2/* paths (callback, start, sign_in,
    # static assets) must reach oauth2-proxy itself directly, with NO
    # forwardAuth/errors middleware applied - confirmed the hard way:
    # without this, Keycloak's redirect back to /oauth2/callback?code=...
    # also got routed through forwardAuth, which found no session cookie
    # yet (the callback hasn't been processed to SET one), returned 401,
    # and the errors middleware wrapped the callback's OWN URL as the
    # "rd" target of a brand new login - an infinite nested-redirect
    # loop, not a one-off glitch. Higher priority than the catch-all rule
    # below so this always wins regardless of Traefik's default rule-
    # length-based ordering.
    - match: "Host(`vault.admin.cerberus.internal`) && PathPrefix(`/oauth2`)"
      kind: Rule
      priority: 100
      services:
        - name: oauth2-proxy
          namespace: oauth2-proxy
          port: 80
    # Vault's own API (/v1/*) - used by the `vault` CLI, Terraform's
    # vault provider, and Vault's own native OIDC auth method's token
    # exchange callback (/v1/auth/oidc/oidc/callback). None of these are
    # a browser with an oauth2-proxy session cookie - they authenticate
    # with Vault's own X-Vault-Token header (or, for the OIDC callback,
    # are mid-flow and have no cookie yet either), so routing the API
    # through the same ForwardAuth gate as the UI breaks every
    # programmatic/CLI access path outright. Vault's own token auth is
    # already the real protection for the API - the UI (the catch-all
    # route below) is the only piece that actually needs oauth2-proxy's
    # gate, since it's the only piece a human browses to without
    # already proving who they are first.
    - match: "Host(`vault.admin.cerberus.internal`) && PathPrefix(`/v1`)"
      kind: Rule
      priority: 100
      services:
        - name: vault-ui
          port: 8200
          scheme: https
          serversTransport: vault-backend-tls
    - match: "Host(`vault.admin.cerberus.internal`)"
      kind: Rule
      priority: 10
      # oauth2-proxy-errors comes BEFORE forwardauth - Traefik applies
      # middlewares outermost-first, and errors needs to catch
      # forwardAuth's 401 response, not the other way around. This
      # substitutes oauth2-proxy's own styled sign-in page (a "Sign in
      # with Keycloak OIDC" button) onto that 401, WITHOUT auto-
      # redirecting - no Location header, status stays 401, nothing
      # navigates until the user actually clicks. An instant 401->302
      # auto-redirect (tried first, reverted) would confirm to anyone who
      # can merely reach this hostname, authenticated or not, that it's
      # live and exactly which Keycloak realm fronts it - this gets the
      # same real sign-in page without that disclosure.
      middlewares:
        - { name: oauth2-proxy-errors, namespace: oauth2-proxy }
        - { name: oauth2-proxy-forwardauth, namespace: oauth2-proxy }
      services:
        - name: vault-ui
          port: 8200
          scheme: https
          serversTransport: vault-backend-tls
  tls:
    secretName: vault-admin-tls
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault-admin-tls
  namespace: vault
spec:
  secretName: vault-admin-tls
  dnsNames: ["vault.admin.cerberus.internal"]
  issuerRef: { name: cerberus-internal-ca, kind: ClusterIssuer }
