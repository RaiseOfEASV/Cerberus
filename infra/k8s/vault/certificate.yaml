# Issues Vault's server TLS cert from Epic 8's internal CA. Needs
# cert-manager + infra/k8s/cert-manager/cluster-issuers.yaml applied
# first. dnsNames covers both the in-cluster service name (what ESO and
# ARC runners connect to) and the admin-facing hostname (what a human
# reaches via Traefik+oauth2-proxy+headscale) - a TLS cert checked by two
# very different kinds of clients needs both.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault-server-tls
  namespace: vault
spec:
  secretName: vault-server-tls
  dnsNames:
    - vault.vault.svc
    - vault.vault.svc.cluster.local
    - vault.admin.cerberus.internal
  issuerRef:
    name: cerberus-internal-ca
    kind: ClusterIssuer
