# Issues Vault's server TLS cert from Epic 8's internal CA. Needs
# cert-manager + infra/k8s/cert-manager/cluster-issuers.yaml applied
# first. dnsNames covers both the in-cluster service name (what ESO and
# ARC runners connect to) and the admin-facing hostname (what a human
# reaches via Traefik+oauth2-proxy+headscale) - a TLS cert checked by two
# very different kinds of clients needs both.
#
# ipAddresses: 127.0.0.1 matters for docs/security/vault-unseal-
# procedure.md's own claim that "kubectl exec into the pod still works
# exactly as below regardless [of TLS]" - that command's default
# VAULT_ADDR is https://127.0.0.1:8200, which failed cert verification
# ("doesn't contain any IP SANs") until this was added. Without it, the
# documented init/unseal commands don't actually work as written.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault-server-tls
  namespace: vault
spec:
  secretName: vault-server-tls
  dnsNames:
    - vault.vault.svc
    - vault.vault.svc.cluster.local
    - vault.admin.cerberus.internal
  ipAddresses:
    - 127.0.0.1
  issuerRef:
    name: cerberus-internal-ca
    kind: ClusterIssuer
