# Standard cert-manager self-signed-CA bootstrap, in 3 steps:
#   1. A root Issuer that can only self-sign (bootstraps step 2's CA cert).
#   2. A CA Certificate, self-signed by step 1, with CA:true - this is the
#      private root. Its cert must be distributed to and trusted by every
#      VPN-connected admin device (see README) - that trust, combined with
#      headscale restricting WHO can even reach these hosts, is what makes
#      "internal CA" an acceptable answer instead of a weaker one.
#   3. A ClusterIssuer backed by step 2's CA secret - this is what every
#      admin UI's Certificate/Ingress annotation actually references to
#      get a real, auto-renewed cert.
#
# NOT YET APPLIABLE: needs cert-manager installed (Epic 4's cluster first).

apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: selfsigned-bootstrap
  namespace: cert-manager
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cerberus-internal-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: cerberus-internal-ca
  secretName: cerberus-internal-ca-secret
  duration: 87600h # 10 years - this is a root CA, not a leaf cert; rotating it means re-distributing trust to every admin device
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-bootstrap
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: cerberus-internal-ca
spec:
  ca:
    secretName: cerberus-internal-ca-secret
---
# Public-domain ClusterIssuer (cerberoast.site and future public apps) -
# completely separate from the internal CA above, which stays exactly as
# it is for every admin UI. Nothing admin-related should ever reference
# this issuer.
#
# DNS-01 via Cloudflare, not HTTP-01: avoids needing port 80 open for the
# ACME challenge itself (only 443 is strictly needed for real traffic),
# and works even before any Service/IngressRoute exists for the
# challenge to route through. cloudflare-api-token's Secret lives in
# THIS namespace (cert-manager) because ClusterIssuer solvers read their
# secretRef from cert-manager's own cluster-resource-namespace, which
# defaults to wherever cert-manager itself is installed - confirmed via
# cert-manager's own docs, not assumed.
#
# Not yet usable: the Secret below doesn't exist until the Cloudflare
# API token does (see docs/security/sso-break-glass.md's sibling note in
# infra/k8s/traefik-public/README.md for the exact steps - the token
# must be scoped to Zone:DNS:Edit on cerberoast.site ONLY, never a
# global/account-wide token).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-public
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-public-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
