# Declarative realm/client config - "code-defined, not click-ops" applied
# to Keycloak the same way it's applied everywhere else in this repo.
# Consumed by keycloak-config-cli (adorsys), not a Terraform provider -
# Keycloak's own Terraform providers are third-party and less battle-
# tested than this tool, which is purpose-built for exactly this file
# format and widely used for Keycloak-as-code.
#
# UNVERIFIED against a live Keycloak instance - same caliber of caveat as
# Epic 2's Nexus provision.sh and Epic 7's Falcosidekick->Wazuh syslog
# bridge. Double-check keycloak-config-cli's exact schema version
# compatibility with whatever Keycloak version the chart pins before
# relying on this.
#
# redirectUris below use the same *.admin.cerberus.internal hostnames as
# infra/headscale/config/config.yaml's extra_records and
# infra/k8s/oauth2-proxy/ingressroutes.yaml - keep all three in sync if
# the domain ever changes.
#
# The "admins" group gates nothing by itself - without the client's own
# protocolMappers (below) adding group membership to the token, and
# oauth2-proxy's --oidc-groups-claim/--allowed-group actually checking
# it, any authenticated user in this realm would pass through, group
# membership or not.

realm: cerberus-admin
enabled: true
sslRequired: external

# oauth2-proxy's --oidc-groups-claim=groups makes it request a "groups"
# OAuth scope in the auth request (confirmed live: the real redirect to
# Keycloak had "scope=openid+email+profile+groups") - Keycloak validates
# every requested scope against a real, known client scope and rejects
# the WHOLE request with "invalid_scope" if one doesn't exist, which is
# exactly what happened before this existed (a client-level
# protocolMapper alone isn't enough - that puts the claim in the token
# once a request is already accepted, it doesn't make "groups" a valid
# scope to request in the first place).
clientScopes:
  - name: groups
    protocol: openid-connect
    protocolMappers:
      - name: groups
        protocol: openid-connect
        protocolMapper: oidc-group-membership-mapper
        config:
          claim.name: groups
          full.path: "false"
          id.token.claim: "true"
          access.token.claim: "true"
          userinfo.token.claim: "true"

clients:
  - clientId: oauth2-proxy
    enabled: true
    clientAuthenticatorType: client-secret
    secret: "${CLIENT_SECRET_OAUTH2_PROXY}" # keycloak-config-cli resolves ${VAR} from its own env - never hardcode the real value here
    redirectUris:
      - "https://vault.admin.cerberus.internal/oauth2/callback"
      - "https://argocd.admin.cerberus.internal/oauth2/callback"
      - "https://grafana.admin.cerberus.internal/oauth2/callback"
      - "https://wazuh.admin.cerberus.internal/oauth2/callback"
      - "https://kibana.admin.cerberus.internal/oauth2/callback"
      - "https://dependency-track.admin.cerberus.internal/oauth2/callback"
    webOrigins: ["+"]
    standardFlowEnabled: true
    directAccessGrantsEnabled: false
    # Without the "groups" client scope (above) being a DEFAULT scope
    # here, the "admins" group below still gates nothing - group
    # membership wouldn't be a valid, requestable scope, so oauth2-proxy's
    # --allowed-group would have no claim to check against and every
    # successfully authenticated Keycloak user would pass through
    # regardless of group. full.path: "false" (on the scope's mapper
    # above) matters too: with it true the claim value is "/admins",
    # which has to match oauth2-proxy's --allowed-group exactly - set to
    # "false" so the claim is the bare group name instead, consistent
    # with the oauth2-proxy-values.yaml flag below.
    # keycloak-config-cli treats this list as the FULL desired state, not
    # an addition to whatever Keycloak auto-assigned on client creation -
    # the realm's other built-in default scopes are listed explicitly
    # here too, so adding "groups" doesn't silently strip "email"/
    # "profile" and trade one invalid_scope error for another.
    defaultClientScopes:
      - profile
      - email
      - roles
      - web-origins
      - acr
      - basic
      - groups

groups:
  - name: admins
