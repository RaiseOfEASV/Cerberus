# One-off Job running keycloak-config-cli against realm-config.yaml. Run
# manually after Keycloak reports healthy, not wired into any automated
# trigger - re-run it any time realm-config.yaml changes.
#
# REAL, CONFIRMED HAZARD: re-running this Job for ANY reason - even just
# adding a brand-new client - appears to silently regenerate the
# `secret` of EXISTING clients too, even when the given value already
# matches. Hit this for real: re-ran this Job solely to add the "vault"
# and "argocd" clients, and oauth2-proxy's own login broke immediately
# after with a genuine client-secret mismatch (confirmed via a direct
# token-endpoint test, not assumed) - not caused by anything else
# changing. Root cause not fully pinned down (keycloak-config-cli docs/
# issues didn't give a clear answer), so treat it as a standing fact
# about this tool rather than a one-off bug.
#
# Until/unless that's root-caused: after EVERY run of this Job, re-sync
# every client secret FROM Keycloak back to Vault (not the other way
# around) for ALL clients with an explicit `secret:` field in
# realm-config.yaml (oauth2-proxy, vault, argocd) - regenerate via
# Keycloak's own admin API, write the result to Vault, force an ESO
# resync, restart whichever pod consumes it. Don't assume "I only
# touched one client" means the others are safe.
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-apply-realm-config
  namespace: keycloak
spec:
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: keycloak-config-cli
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          # Originally pinned to 6.2.0-25.0.1, which predates this
          # project's actual Keycloak version (26.8.1) - the tag naming
          # scheme also dropped the "-keycloak-" infix in newer releases
          # ("<cli-version>-<keycloak-version>", not "<cli-version>-
          # keycloak-<keycloak-version>"). Checked Docker Hub's real tag
          # list rather than guessing; this is the newest pairing for
          # Keycloak 26.x, confirmed pullable.
          image: adorsys/keycloak-config-cli:6.5.1-26.5.5
          env:
            - { name: KEYCLOAK_URL, value: "http://keycloak-http.keycloak.svc:80" }
            - name: KEYCLOAK_USER
              valueFrom: { secretKeyRef: { name: keycloak-admin-credentials, key: admin-user } }
            - name: KEYCLOAK_PASSWORD
              valueFrom: { secretKeyRef: { name: keycloak-admin-credentials, key: admin-password } }
            - name: CLIENT_SECRET_OAUTH2_PROXY
              # oauth2-proxy-credentials (the oauth2-proxy pod's own copy
              # of this value) lives in the oauth2-proxy namespace -
              # Secrets don't cross namespaces, so this Job needs its own
              # sync of the same Vault path, see
              # infra/k8s/eso/external-secret-oauth2-proxy-client-for-keycloak.yaml.
              valueFrom: { secretKeyRef: { name: oauth2-proxy-client-secret, key: client-secret } }
            - name: CLIENT_SECRET_VAULT
              valueFrom: { secretKeyRef: { name: vault-oidc-client-secret, key: client-secret } }
            - name: CLIENT_SECRET_ARGOCD
              valueFrom: { secretKeyRef: { name: argocd-oidc-client-secret, key: client-secret } }
            - { name: IMPORT_FILES_LOCATIONS, value: "/config/realm-config.yaml" }
          volumeMounts:
            - { name: config, mountPath: /config }
      volumes:
        - name: config
          configMap: { name: keycloak-realm-config }
