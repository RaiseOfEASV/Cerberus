---
- name: Install auditd
  ansible.builtin.apt:
    name:
      - auditd
      - audispd-plugins
    state: present
    update_cache: true

- name: Deploy audit rules
  ansible.builtin.copy:
    src: cis-audit.rules
    dest: /etc/audit/rules.d/baseline.rules
    mode: "0640"
  notify: restart auditd

- name: Ensure auditd is enabled and running
  ansible.builtin.systemd:
    name: auditd
    enabled: true
    state: started
