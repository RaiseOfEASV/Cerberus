# Values for the `traefik` chart (traefik.github.io/charts). Gets its
# external IP from MetalLB (Service.type: LoadBalancer) - install MetalLB
# and apply infra/k8s/metallb/ip-address-pool.yaml first.
#
# ports.web/websecure's shape is chart v42's (Traefik v3.7) - the
# top-level `redirectTo`/`tls` keys this originally used are from an older
# chart major version and were rejected outright by the schema
# (`additional properties 'redirectTo'/'tls' not allowed`) the first time
# this was actually installed. Nested under `http` now.

service:
  type: LoadBalancer

ports:
  web:
    # Redirect to websecure - no plaintext HTTP for anything behind this,
    # including internal admin UIs once Epic 8 puts them here too.
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    http:
      tls:
        enabled: true

providers:
  kubernetesIngress:
    enabled: true
  kubernetesCRD:
    enabled: true
    # Default false - every admin UI's IngressRoute (vault, argocd,
    # keycloak's own) lives in its own app namespace but references the
    # ONE shared oauth2-proxy-forwardauth Middleware in the oauth2-proxy
    # namespace (Epic 8's whole point - one shared instance, not one per
    # app). Confirmed the hard way: without this, Traefik logs a real
    # "allowCrossNamespace is disabled" error per IngressRoute and serves
    # a bare 404 instead of ever calling the middleware - looks like a
    # routing failure, not a config omission, until read from the logs.
    allowCrossNamespace: true

# limits.cpu was missing - background scan after Kyverno's
# require-resource-limits policy went in flagged this as a real
# violation (admission control doesn't retroactively evict an
# already-running pod, but any future recreation would have been
# blocked).
resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: 200m, memory: 256Mi }

# NOTE: no cert-manager/ACME config here - TLS termination needs real
# certificates from somewhere. Not decided yet: internal CA (consistent
# with "admin UIs are never on public ingress", Epic 8) vs. Let's Encrypt
# (only makes sense for anything actually public-facing). Revisit when
# Epic 8's VPN/oauth2-proxy design is implemented and it's clear what, if
# anything, here is ever public.
