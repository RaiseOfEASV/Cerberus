# Grafana Alloy (chart `alloy` 1.16.0, grafana/helm-charts) as a DaemonSet,
# managed remotely by Grafana Cloud Fleet Management: what it collects is
# configured in Grafana Cloud, this file only runs it.
#
# Not the k8s-monitoring chart Grafana's onboarding suggests. That chart
# deploys alloy-operator, whose ClusterRole has bind/escalate on ClusterRoles
# (cluster-admin equivalent), gives Alloy get/list/watch on every Secret in
# the cluster, and its onboarding presets make Alloy privileged with the host
# network. Here:
#   - Alloy runs as UID 0 (pod logs are root-only) with every capability
#     dropped, GID 4 (adm) for syslog/auth.log, read-only root filesystem.
#     Same model as infra/k8s/elastic-agent/. Mounts only /var/log.
#   - RBAC: Alloy's default read rules minus secrets and configmaps, plus
#     nodes, nodes/metrics, nodes/stats for kubelet metrics. No nodes/proxy
#     (GET on it is enough to exec into pods through the kubelet). The one
#     secret it needs is granted by name in infra/k8s/grafana-cloud/rbac.yaml.
#   - remotecfg sends the same attributes the k8s-monitoring chart would, so
#     Fleet Management pipelines that target them still match.
#
# Credentials: Vault secret/grafana/cloud (username, password) -> ESO ->
# Secret grafana-cloud-fleet (infra/k8s/grafana-cloud/external-secret.yaml).
#
# Install (after the ExternalSecret and rbac.yaml):
#   helm upgrade --install grafana-alloy alloy --repo https://grafana.github.io/helm-charts \
#     --version 1.16.0 -n monitoring -f infra/helm/values/grafana-alloy-values.yaml

alloy:
  stabilityLevel: generally-available
  storagePath: /tmp/alloy
  configMap:
    create: true
    content: |
      remote.kubernetes.secret "fleet" {
        name      = "grafana-cloud-fleet"
        namespace = "monitoring"
      }

      remotecfg {
        id  = string.format("grafana-cloud-%s-%s-%s-%s", "cerberus-k3s", "monitoring", "alloy-daemon", sys.env("K8S_NODE_NAME"))
        url = "https://fleet-management-prod-011.grafana.net"
        basic_auth {
          username = convert.nonsensitive(remote.kubernetes.secret.fleet.data["username"])
          password = remote.kubernetes.secret.fleet.data["password"]
        }
        poll_frequency = "30s"
        attributes = {
          "cluster"       = "cerberus-k3s",
          "namespace"     = "monitoring",
          "platform"      = "kubernetes",
          "presets"       = "small,filesystem-log-reader,daemonset",
          "release"       = "grafana-cloud",
          "source"        = "k8s-monitoring",
          "sourceVersion" = "4.6.1",
          "workloadName"  = "alloy-daemon",
          "workloadType"  = "daemonset",
        }
      }

      // Local pipeline, next to whatever Fleet Management pushes: node_exporter
      // on both VMs (infra/node-exporter/) to Grafana Cloud Prometheus, for the
      // "Node Exporter Full" dashboard (infra/grafana/). job/instance follow
      // Grafana's Linux integration conventions.
      prometheus.scrape "node_exporter" {
        job_name        = "integrations/node_exporter"
        scrape_interval = "30s"
        targets = [
          {"__address__" = "10.0.2.4:9100", "instance" = "cerberus-k3s-vm"},
          // Its own cluster label: not part of the Kubernetes cluster, so the
          // Kubernetes dashboards don't count it as a node.
          {"__address__" = "10.0.1.4:9100", "instance" = "cerberus-bootstrap-vm", "cluster" = "cerberus-bootstrap"},
        ]
        forward_to = [prometheus.remote_write.grafana_cloud.receiver]
      }

      // Kubernetes object state for the "Kubernetes / Views" dashboards
      // (infra/grafana/). Only the series those dashboards query: about 1,600
      // of the ~5,700 kube-state-metrics exposes (Grafana Cloud free tier caps
      // active series).
      prometheus.scrape "kube_state_metrics" {
        job_name        = "integrations/kubernetes/kube-state-metrics"
        scrape_interval = "60s"
        targets         = [{"__address__" = "kube-state-metrics.monitoring.svc:8080"}]
        forward_to      = [prometheus.relabel.kube_state_metrics.receiver]
      }

      prometheus.relabel "kube_state_metrics" {
        rule {
          source_labels = ["__name__"]
          regex         = "kube_(node_info|namespace_created|namespace_labels|pod_info|pod_status_phase|pod_status_qos_class|pod_status_reason|pod_status_scheduled|pod_container_info|pod_container_resource_limits|pod_container_resource_requests|pod_container_status_restarts_total|pod_container_status_running|pod_container_status_last_terminated_exitcode|pod_container_status_last_terminated_reason|pod_container_status_waiting_reason|deployment_labels|daemonset_labels|statefulset_labels|hpa_labels|ingress_info|service_info|endpoint_info|networkpolicy_labels|persistentvolumeclaim_info)"
          action        = "keep"
        }
        forward_to = [prometheus.remote_write.grafana_cloud.receiver]
      }

      // Per-container CPU, memory, OOM and pod network from the kubelet's
      // cAdvisor endpoint on this node (RBAC: nodes/metrics, not nodes/proxy).
      // The kubelet's serving certificate is self-signed by k3s and not in
      // the pod's CA bundle, hence insecure_skip_verify; the target is the
      // node's own IP.
      prometheus.scrape "cadvisor" {
        job_name          = "integrations/kubernetes/cadvisor"
        scheme            = "https"
        metrics_path      = "/metrics/cadvisor"
        scrape_interval   = "60s"
        bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
        tls_config {
          insecure_skip_verify = true
        }
        targets    = [{"__address__" = string.format("%s:10250", sys.env("HOST_IP")), "instance" = "cerberus-k3s-vm"}]
        forward_to = [prometheus.relabel.cadvisor.receiver]
      }

      prometheus.relabel "cadvisor" {
        rule {
          source_labels = ["__name__"]
          regex         = "container_(cpu_usage_seconds_total|cpu_cfs_throttled_seconds_total|memory_working_set_bytes|oom_events_total|network_(receive|transmit)_(bytes|packets|errors|packets_dropped)_total)"
          action        = "keep"
        }
        // CPU/memory/OOM only per container (the pod- and node-level cgroups
        // have container=""); network only for the pod's eth0.
        rule {
          source_labels = ["__name__", "container"]
          regex         = "container_(cpu|memory|oom)[a-z_]*;"
          action        = "drop"
        }
        rule {
          source_labels = ["interface"]
          regex         = "(eth0|)"
          action        = "keep"
        }
        forward_to = [prometheus.remote_write.grafana_cloud.receiver]
      }

      // Both Traefik instances (admin and public), found by their named
      // metrics port so pod restarts don't break the target. instance = the
      // namespace (traefik / traefik-public).
      discovery.kubernetes "traefik" {
        role = "pod"
        selectors {
          role  = "pod"
          label = "app.kubernetes.io/name=traefik"
        }
      }

      discovery.relabel "traefik" {
        targets = discovery.kubernetes.traefik.targets
        rule {
          source_labels = ["__meta_kubernetes_pod_container_port_name"]
          regex         = "metrics"
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "instance"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
      }

      prometheus.scrape "traefik" {
        job_name        = "integrations/traefik"
        scrape_interval = "30s"
        targets         = discovery.relabel.traefik.output
        forward_to      = [prometheus.remote_write.grafana_cloud.receiver]
      }

      prometheus.remote_write "grafana_cloud" {
        endpoint {
          // Stack tenderraccoon360, Prometheus instance 3796712.
          url = "https://prometheus-prod-72-prod-eu-west-4.grafana.net/api/prom/push"
          basic_auth {
            username = "3796712"
            password = sys.env("GCLOUD_RW_API_KEY")
          }
        }
        external_labels = { cluster = "cerberus-k3s" }
      }
  # K8S_NODE_NAME (used in the remotecfg id) is set by the chart itself.
  extraEnv:
    - name: NAMESPACE
      valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
    - name: POD_NAME
      valueFrom: { fieldRef: { fieldPath: metadata.name } }
    - name: CLUSTER_NAME
      value: cerberus-k3s
    # The node's IP, for the kubelet cAdvisor scrape.
    - name: HOST_IP
      valueFrom: { fieldRef: { fieldPath: status.hostIP } }
    # Fleet Management pipelines authenticate their writes with this.
    - name: GCLOUD_RW_API_KEY
      valueFrom: { secretKeyRef: { name: grafana-cloud-fleet, key: password } }
  securityContext:
    runAsUser: 0
    runAsGroup: 4
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities: { drop: [ALL] }
    seccompProfile: { type: RuntimeDefault }
  # 420 MiB right after start-up with Fleet's default pipelines; the request
  # (scheduling) stays small, the limit leaves room so it isn't OOM-killed.
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 1Gi }
  mounts:
    varlog: true
    dockercontainers: false
    extra:
      - { name: alloy-tmp, mountPath: /tmp }

configReloader:
  resources:
    requests: { cpu: 10m, memory: 50Mi }
    limits: { cpu: 50m, memory: 100Mi }

controller:
  type: daemonset
  tolerations:
    - { effect: NoSchedule, operator: Exists }
  volumes:
    extra:
      - { name: alloy-tmp, emptyDir: {} }

rbac:
  create: true
  rules:
    - apiGroups: ["", "discovery.k8s.io", "networking.k8s.io"]
      resources: ["endpoints", "endpointslices", "ingresses", "pods", "services"]
      verbs: ["get", "list", "watch"]
    - apiGroups: [""]
      resources: ["pods", "pods/log", "namespaces", "events", "nodes", "nodes/metrics", "nodes/stats"]
      verbs: ["get", "list", "watch"]
    - apiGroups: ["apps", "extensions"]
      resources: ["replicasets", "deployments", "daemonsets", "statefulsets"]
      verbs: ["get", "list", "watch"]
    - apiGroups: ["batch"]
      resources: ["jobs", "cronjobs"]
      verbs: ["get", "list", "watch"]
    - nonResourceURLs: ["/metrics"]
      verbs: ["get"]
