# Values for a SECOND, isolated `traefik` chart release ("traefik-public"),
# completely separate from infra/helm/values/traefik-values.yaml's admin
# instance. Exists only to front cerberoast.site and future public apps -
# the admin instance (Vault/ArgoCD/Keycloak, VPN-only) is never touched by
# this file or this release.
#
# The isolation that matters is providers.kubernetesCRD.labelSelector
# below: without it, this instance would ALSO pick up and serve the
# admin IngressRoutes (vault/argocd Host rules) on ITS public-facing
# Service - the exact regression the whole point of a second instance is
# meant to avoid. Every public-app IngressRoute must carry the label
# `traefik-instance: public`; nothing admin-related ever will, so the
# isolation is opt-in for the new side, zero risk to the existing one.
# (The reverse isn't scoped - the admin instance's own labelSelector is
# untouched, so it will also harmlessly try to serve public IngressRoutes
# too, but only on its own private VIP, never reachable from the
# internet. Cosmetic duplication, not a security issue - left alone to
# avoid touching the already-stable admin Traefik config at all.)

service:
  annotations:
    metallb.universe.tf/address-pool: cerberus-public-pool
  # Local, not Cluster: keeps the connecting address (a Cloudflare edge)
  # instead of SNATing it to the node, so trustedIPs below can match it.
  # Single node, so no traffic is dropped by Local.
  spec:
    # type under spec: chart 42.4+ rejects a top-level service.type.
    type: LoadBalancer
    externalTrafficPolicy: Local

ports:
  web:
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    http:
      tls:
        enabled: true
    # cerberoast.site is proxied by Cloudflare: believe its X-Forwarded-For
    # (the real client) only from Cloudflare's published edge ranges
    # (https://www.cloudflare.com/ips-v4). vuln-api's rate limit on the
    # public report form depends on this.
    forwardedHeaders:
      trustedIPs:
        - 173.245.48.0/20
        - 103.21.244.0/22
        - 103.22.200.0/22
        - 103.31.4.0/22
        - 141.101.64.0/18
        - 108.162.192.0/18
        - 190.93.240.0/20
        - 188.114.96.0/20
        - 197.234.240.0/22
        - 198.41.128.0/17
        - 162.158.0.0/15
        - 104.16.0.0/13
        - 104.24.0.0/14
        - 172.64.0.0/13
        - 131.0.72.0/22

providers:
  kubernetesIngress:
    enabled: false
  kubernetesCRD:
    enabled: true
    labelSelector: "traefik-instance=public"
    allowCrossNamespace: true

resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: 200m, memory: 256Mi }

# Structured logs for the log shippers (Elastic Agent / Grafana Alloy).
# Access logs: one JSON line per request on stdout. Headers are dropped by
# default; only the few needed to trace a client are kept. Cookie and
# Authorization are never logged. Query strings stay in RequestPath: that is
# where injection payloads show up, and no secret travels in a query here
# (the OIDC code is PKCE-bound and single-use).
log:
  format: json
accessLog:
  enabled: true
  format: json
  fields:
    defaultMode: keep
    headers:
      defaultMode: drop
      names:
        User-Agent: keep
        Referer: keep
        X-Forwarded-For: keep
        X-Real-Ip: keep
        Cf-Connecting-Ip: keep
        Cf-Ray: keep
        Cf-Ipcountry: keep
        Authorization: drop
        Cookie: drop
