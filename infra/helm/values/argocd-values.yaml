# Values for the `argo-cd` chart (argoproj.github.io/argo-helm). ArgoCD is
# the GitOps controller - .github/workflows/deploy.yml (Epic 3) only ever
# edits infra/k8s/environments/<env>/, never runs kubectl/helm itself;
# ArgoCD (running in-cluster, under its own ServiceAccount/RBAC) is what
# actually reconciles that config onto the cluster. CI never holds cluster
# credentials - this is the piece that makes that true.
#
# server.service.type is deliberately ClusterIP, not LoadBalancer - the
# ArgoCD UI/API is an admin UI and per the plan (Epic 8) admin UIs are
# never on public ingress. Epic 8 now fronts this via Traefik + the shared
# oauth2-proxy + headscale instead of `kubectl port-forward` - see
# infra/k8s/oauth2-proxy/ingressroutes.yaml. ClusterIP stays correct even
# with that in front: Traefik/oauth2-proxy reach it in-cluster, nothing
# public touches this Service directly.
#
# dex (built-in SSO) and notifications are both chart defaults that this
# design doesn't use - Epic 8 puts oauth2-proxy + Keycloak in front of
# every admin UI instead of ArgoCD's own Dex, and no notification
# receiver (Slack webhook, etc.) exists to wire up yet. Disabled rather
# than left running unconfigured.
dex:
  enabled: false

notifications:
  enabled: false

server:
  service:
    type: ClusterIP
  extraArgs:
    - --insecure # TLS terminates at Traefik/oauth2-proxy once Epic 8 fronts this - revisit if that assumption changes
  # ArgoCD's own native OIDC login (configs.cm.oidc.config below) makes
  # its own outbound call to Keycloak's discovery endpoint - without
  # this, that call fails with a real "x509: certificate signed by
  # unknown authority", since Traefik's cert there comes from
  # cert-manager's internal CA (infra/k8s/argocd/ca-configmap.yaml),
  # which isn't in the container's default trust store. Same fix
  # already needed for oauth2-proxy and Vault's own OIDC auth method.
  volumes:
    - name: cerberus-internal-ca
      configMap: { name: cerberus-internal-ca }
  volumeMounts:
    - name: cerberus-internal-ca
      mountPath: /etc/ssl/certs/cerberus-internal-ca.crt
      subPath: ca.crt
      readOnly: true
  # limits.cpu was missing here and on every resources block below (chart
  # defaults ship ALL of these as `resources: {}` - checked directly
  # against the chart rather than guessing) - the same gap Kyverno's
  # require-resource-limits policy already caught for real on
  # metallb/traefik (see infra/k8s/README.md). Unlike that case, these
  # components don't exist yet, so a missing limit here would have
  # failed at admission time (helm install itself erroring), not shown
  # up later via background scan.
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 200m, memory: 256Mi }

configs:
  params:
    server.insecure: true
  cm:
    # Native OIDC, not Dex (disabled above) - ArgoCD's server handles
    # this directly since chart v2+/ArgoCD 2.x+. url matters beyond just
    # being descriptive: ArgoCD computes its own OIDC redirect_uri from
    # it, so without this being set to the real external hostname, the
    # redirect_uri it sends to Keycloak wouldn't match the one registered
    # on the "argocd" client in infra/keycloak/realm-config.yaml.
    url: https://argocd.admin.cerberus.internal
    oidc.config: |
      name: Keycloak
      issuer: https://keycloak.admin.cerberus.internal/realms/cerberus-admin
      clientID: argocd
      clientSecret: $argocd-secret:oidc.keycloak.clientSecret
      requestedScopes: ["openid", "profile", "email", "groups"]
    # Keycloak is meant to be the ONLY way in, not an alternative sitting
    # next to the local admin/password login - without this, that local
    # account is still a full, parallel, non-Keycloak path into ArgoCD
    # regardless of how locked-down the OIDC side is. Break-glass if
    # Keycloak/oauth2-proxy ever breaks is direct cluster access (kubectl),
    # not this account - see docs/security/sso-break-glass.md.
    admin.enabled: "false"
  rbac:
    # Without this, a Keycloak login gets you authenticated into ArgoCD
    # but with NO permissions at all (ArgoCD's RBAC defaults deny
    # everything not explicitly granted) - maps the same "admins" group
    # everything else in this project gates on to ArgoCD's own built-in
    # full-access role.
    policy.default: role:readonly
    policy.csv: |
      g, admins, role:admin
    scopes: "[groups]"

controller:
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }

repoServer:
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 200m, memory: 256Mi }

redis:
  resources:
    requests: { cpu: 100m, memory: 64Mi }
    limits: { cpu: 200m, memory: 128Mi }

applicationSet:
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 200m, memory: 256Mi }

# Found by actually running the install, not by auditing the chart
# upfront: this Job's pre-install hook got blocked outright by Kyverno
# before any of the main components even started - require-resource-
# limits applies to Jobs too via Kyverno's autogen (it generates
# equivalent rules for every pod-template-owning kind, not just bare
# Pods).
redisSecretInit:
  resources:
    requests: { cpu: 50m, memory: 32Mi }
    limits: { cpu: 100m, memory: 64Mi }
