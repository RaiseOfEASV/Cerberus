# Generic Cerberus app chart. Kyverno's baseline (non-root, read-only rootfs,
# cpu+memory requests/limits, no :latest, signed ghcr.io/raiseofeasv images)
# is baked into the templates; per-app values only fill in what varies.

image:
  repository: ""   # required, e.g. ghcr.io/raiseofeasv/vuln-api
  tag: ""          # required - never "latest" (Kyverno disallow-latest-tag)
  # Manifest digest (sha256:...) of that tag. Set by deploy.yml alongside the
  # tag. Kyverno's verify-image-signatures pins images to their digest at
  # admission anyway; rendering it here keeps git identical to what runs
  # (otherwise ArgoCD shows a permanent diff) and makes every deploy
  # reference an immutable image.
  digest: ""

replicaCount: 1
containerPort: 8080

# Numeric UID the container runs as. Required by Kubernetes to verify
# runAsNonRoot when the image declares a named user (distroless "nonroot").
# 65532 = distroless nonroot; nginx-unprivileged uses 101.
podSecurityContext:
  runAsUser: 65532
  runAsGroup: 65532

# The root filesystem is always read-only. List paths that genuinely need to
# be writable; each gets its own emptyDir.
writablePaths: []

probes:
  path: /healthz

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi

# List of {name, value}.
env: []

# Public exposure via traefik-public (IngressRoute labeled
# traefik-instance: public). dev/staging leave this off.
ingress:
  enabled: false
  hosts: []
  tlsSecretName: ""

# --- Optional features (all off by default) ---

# Secrets loaded whole into the app container's environment (envFrom).
envFromSecrets: []

# Dedicated ServiceAccount. The pod still sets
# automountServiceAccountToken: false - use vaultToken for a scoped token.
serviceAccount:
  create: false
  name: ""   # defaults to the release name

# Short-lived projected ServiceAccount token for Vault's Kubernetes auth,
# mounted at <path>/token (audience-bound, rotated by the kubelet).
vaultToken:
  enabled: false
  audience: vault
  path: /var/run/secrets/vault

# ConfigMap holding the internal CA (key ca.crt), mounted read-only at
# /etc/cerberus/ca.crt - e.g. to verify Vault's TLS certificate.
caConfigMap: ""

# One initContainer running the same image (e.g. database migrations),
# with the same securityContext and resources as the app container and
# its own secrets - the app's envFromSecrets are NOT passed to it.
initContainer:
  enabled: false
  args: []
  envFromSecrets: []

# Run as a CronJob instead of a Deployment + Service (e.g. vuln-scanner).
# Setting schedule switches the workload kind; probes and ports don't apply.
cronJob:
  schedule: ""            # cron syntax, e.g. "0 2 * * *"
  timeZone: Etc/UTC
  activeDeadlineSeconds: 3600
  args: []

# Kubernetes API access for the pod's own ServiceAccount: the standard
# token + cluster CA + namespace, mounted at
# /var/run/secrets/kubernetes.io/serviceaccount. Still opt-in - the pod keeps
# automountServiceAccountToken: false. Grant permissions with a Role
# outside the chart.
kubeApiToken:
  enabled: false
