{{- $repo := required "image.repository is required" .Values.image.repository -}}
{{- $tag := required "image.tag is required" .Values.image.tag | toString -}}
{{- if eq $tag "latest" }}{{ fail "image.tag must not be \"latest\" (Kyverno disallow-latest-tag)" }}{{ end -}}
{{- $digest := .Values.image.digest | default "" | toString -}}
{{- if and $digest (not (regexMatch "^sha256:[a-f0-9]{64}$" $digest)) }}{{ fail "image.digest must look like sha256:<64 hex chars>" }}{{ end -}}
{{- $image := printf "%s:%s" $repo $tag -}}
{{- if $digest }}{{ $image = printf "%s@%s" $image $digest }}{{ end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "app.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.podSecurityContext.runAsUser }}
        runAsGroup: {{ .Values.podSecurityContext.runAsGroup }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: "{{ $image }}"
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
          {{- with .Values.env }}
          env:
            {{- range . }}
            - name: {{ .name | quote }}
              value: {{ .value | quote }}
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: {{ .Values.containerPort }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: {{ .Values.containerPort }}
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          {{- with .Values.writablePaths }}
          volumeMounts:
            {{- range $i, $p := . }}
            - name: writable-{{ $i }}
              mountPath: {{ $p }}
            {{- end }}
          {{- end }}
      {{- with .Values.writablePaths }}
      volumes:
        {{- range $i, $p := . }}
        - name: writable-{{ $i }}
          emptyDir: {}
        {{- end }}
      {{- end }}
