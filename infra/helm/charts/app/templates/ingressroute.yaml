{{- if .Values.ingress.enabled }}
{{- if not .Values.ingress.hosts }}{{ fail "ingress.hosts must list at least one host when ingress.enabled" }}{{ end }}
# Labeled traefik-instance: public so traefik-public's labelSelector serves
# it (infra/helm/values/traefik-public-values.yaml).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
    traefik-instance: public
spec:
  entryPoints: [websecure]
  routes:
    {{- range .Values.ingress.hosts }}
    - match: "Host(`{{ . }}`)"
      kind: Rule
      services:
        - name: {{ include "app.fullname" $ }}
          port: 80
    {{- end }}
  tls:
    secretName: {{ required "ingress.tlsSecretName is required when ingress.enabled" .Values.ingress.tlsSecretName }}
{{- end }}
