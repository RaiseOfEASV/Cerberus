{{- if .Values.backup.enabled }}
{{- $name := include "pg.name" . -}}
# Daily pg_dump (custom format) as vulnman_owner, uploaded to the backup
# MinIO. No shell needed in the mc image: pg_dump writes a timestamped
# file, then `mc mirror` uploads the directory.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $name }}-backup
  labels: {{- include "pg.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ $name }}-backup
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            fsGroup: 70
            seccompProfile: { type: RuntimeDefault }
          initContainers:
            - name: dump
              image: {{ .Values.image }}
              command: ["sh", "-c", "pg_dump -Fc -h {{ $name }} -U vulnman_owner -d {{ .Values.database }} -f /backup/{{ .Values.database }}-$(date -u +%Y%m%dT%H%M%SZ).dump"]
              env:
                - name: PGPASSWORD
                  valueFrom: { secretKeyRef: { name: {{ $name }}-credentials, key: owner_password } }
              securityContext: {{- include "pg.containerSecurityContext" . | nindent 16 }}
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { cpu: 200m, memory: 256Mi }
              volumeMounts: [{ name: backup, mountPath: /backup }]
          containers:
            - name: upload
              image: {{ .Values.backup.mcImage }}
              args: ["mirror", "/backup", "backup/cerberus-backups/{{ required "backup.prefix is required" .Values.backup.prefix }}"]
              env:
                - { name: MC_CONFIG_DIR, value: /tmp/mc }
              envFrom: [{ secretRef: { name: {{ $name }}-backup-minio } }]
              securityContext:
                runAsUser: 65532
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              resources:
                requests: { cpu: 25m, memory: 32Mi }
                limits: { cpu: 200m, memory: 128Mi }
              volumeMounts:
                - { name: backup, mountPath: /backup, readOnly: true }
                - { name: tmp, mountPath: /tmp }
          volumes:
            - { name: backup, emptyDir: {} }
            - { name: tmp, emptyDir: {} }
{{- end }}
