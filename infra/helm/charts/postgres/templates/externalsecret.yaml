{{- $name := include "pg.name" . -}}
{{- $path := required "vaultPath is required" .Values.vaultPath -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}-credentials
spec:
  secretStoreRef: { name: vault-backend, kind: ClusterSecretStore }
  refreshInterval: 1h
  target:
    name: {{ $name }}-credentials
  data:
    - { secretKey: superuser_password, remoteRef: { key: {{ $path }}, property: superuser_password } }
    - { secretKey: owner_password, remoteRef: { key: {{ $path }}, property: owner_password } }
    - { secretKey: app_password, remoteRef: { key: {{ $path }}, property: app_password } }
---
# DATABASE_URL for the running app (vulnman_app). The {{ "{{ ... }}" }} below
# is an ESO template, rendered by ESO, not Helm.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}-app-url
spec:
  secretStoreRef: { name: vault-backend, kind: ClusterSecretStore }
  refreshInterval: 1h
  target:
    name: {{ $name }}-app-url
    template:
      data:
        DATABASE_URL: "postgres://vulnman_app:{{ "{{ .app_password }}" }}@{{ $name }}:5432/{{ .Values.database }}?sslmode=disable"
  data:
    - { secretKey: app_password, remoteRef: { key: {{ $path }}, property: app_password } }
---
# MIGRATE_DATABASE_URL for the migrations initContainer (vulnman_owner).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}-owner-url
spec:
  secretStoreRef: { name: vault-backend, kind: ClusterSecretStore }
  refreshInterval: 1h
  target:
    name: {{ $name }}-owner-url
    template:
      data:
        MIGRATE_DATABASE_URL: "postgres://vulnman_owner:{{ "{{ .owner_password }}" }}@{{ $name }}:5432/{{ .Values.database }}?sslmode=disable"
  data:
    - { secretKey: owner_password, remoteRef: { key: {{ $path }}, property: owner_password } }
{{- if .Values.backup.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}-backup-minio
spec:
  secretStoreRef: { name: vault-backend, kind: ClusterSecretStore }
  refreshInterval: 1h
  target:
    name: {{ $name }}-backup-minio
    template:
      data:
        # http: the backup MinIO has no TLS (infra/backups/README.md).
        MC_HOST_backup: "http://{{ "{{ .access_key }}:{{ .secret_key }}@{{ .endpoint }}" }}"
  data:
    - { secretKey: access_key, remoteRef: { key: {{ .Values.backup.minioVaultPath }}, property: access_key } }
    - { secretKey: secret_key, remoteRef: { key: {{ .Values.backup.minioVaultPath }}, property: secret_key } }
    - { secretKey: endpoint, remoteRef: { key: {{ .Values.backup.minioVaultPath }}, property: endpoint } }
{{- end }}
