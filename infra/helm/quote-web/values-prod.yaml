# quote-web, prod - deploys into the existing `cerberoast` namespace and
# serves cerberoast.site / www.cerberoast.site. Routing lives in
# infra/k8s/cerberoast/ingressroute.yaml, so the chart's IngressRoute is off.
image:
  repository: ghcr.io/raiseofeasv/quote-web
  # tag + digest bumped by deploy.yml (environment=prod).
  tag: "bootstrap-placeholder"
  digest: ""
podSecurityContext:
  runAsUser: 101
  runAsGroup: 101
writablePaths:
  - /tmp
  - /var/cache/nginx
  - /run/quote-web
env:
  - name: API_URL
    value: "https://api.cerberoast.site"
ingress:
  enabled: false
