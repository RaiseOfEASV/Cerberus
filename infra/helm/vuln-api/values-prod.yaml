# vuln-api, prod - instantiates infra/helm/charts/app (ArgoCD Application in
# infra/k8s/environments/prod/). Secrets arrive via envFromSecrets (ESO).
image:
  repository: ghcr.io/raiseofeasv/vuln-api
  # tag + digest: placeholder until build.yml publishes the first signed
  # image; then bumped by deploy.yml.
  tag: "c8b291db920b68c0432738b48c5bd246c84749bd"
  digest: sha256:d10a4f2ebbd95cf5b7b24a1047d41f5319a45f868db21ec9211f2ac4f2cddd50
serviceAccount:
  create: true
  name: vuln-api
vaultToken:
  enabled: true
caConfigMap: cerberus-internal-ca
envFromSecrets: [vuln-db-app-url, vuln-api-oidc, vuln-api-kc-admin, vuln-scanner-token]
initContainer:
  enabled: true
  args: ["migrate"]
  envFromSecrets: [vuln-db-owner-url]
resources:
  requests: {cpu: 50m, memory: 64Mi}
  limits: {cpu: 300m, memory: 256Mi}
env:
  - {name: PUBLIC_BASE_URL, value: "https://cerberoast.site"}
  - {name: OIDC_ISSUER, value: "https://auth.cerberoast.site/realms/vulnman"}
  - {name: OIDC_DISCOVERY_URL, value: "http://keycloak-public-http.keycloak-public.svc/realms/vulnman"}
  - {name: OIDC_CLIENT_ID, value: vuln-api}
  - {name: KEYCLOAK_ADMIN_BASE_URL, value: "http://keycloak-public-http.keycloak-public.svc"}
  - {name: KEYCLOAK_REALM, value: "vulnman"}
  - {name: KEYCLOAK_ADMIN_CLIENT_ID, value: vuln-api-admin}
  - {name: VAULT_ADDR, value: "https://vault.vault.svc:8200"}
  - {name: VAULT_ROLE, value: "vuln-api-prod"}
  - {name: TRANSIT_DATA_KEY, value: "vulnman-prod-data"}
  - {name: TRANSIT_REPORT_KEY, value: "vulnman-prod-report"}
  # Proxies whose X-Forwarded-For entries are skipped to find the client:
  # Traefik's pods (k3s pod CIDR) and Cloudflare's edge ranges, which sit
  # in front of cerberoast.site (keep in sync with traefik-public-values.yaml).
  - {name: TRUSTED_PROXY_CIDRS, value: "10.42.0.0/16,173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22"}
ingress:
  enabled: false
