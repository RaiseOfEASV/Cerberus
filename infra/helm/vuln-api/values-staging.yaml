# vuln-api, staging - instantiates infra/helm/charts/app (ArgoCD Application in
# infra/k8s/environments/staging/). Secrets arrive via envFromSecrets (ESO).
image:
  repository: ghcr.io/raiseofeasv/vuln-api
  # tag + digest: placeholder until build.yml publishes the first signed
  # image; then bumped by deploy.yml.
  tag: "a8ec3f4bccade11023e157ae48d0bf0de8ae62d9"
  digest: sha256:38d27087533a949831a0de61829b3d09a04b56653e4f2733ad2beed582685070
serviceAccount:
  create: true
  name: vuln-api
vaultToken:
  enabled: true
caConfigMap: cerberus-internal-ca
envFromSecrets: [vuln-db-app-url, vuln-api-oidc, vuln-api-kc-admin, vuln-scanner-token]
initContainer:
  enabled: true
  args: ["migrate"]
  envFromSecrets: [vuln-db-owner-url]
resources:
  requests: {cpu: 50m, memory: 64Mi}
  limits: {cpu: 300m, memory: 256Mi}
env:
  - {name: PUBLIC_BASE_URL, value: "https://vulns-staging.admin.cerberus.internal"}
  - {name: OIDC_ISSUER, value: "https://auth.cerberoast.site/realms/vulnman-staging"}
  - {name: OIDC_DISCOVERY_URL, value: "http://keycloak-public-http.keycloak-public.svc/realms/vulnman-staging"}
  - {name: OIDC_CLIENT_ID, value: vuln-api}
  - {name: KEYCLOAK_ADMIN_BASE_URL, value: "http://keycloak-public-http.keycloak-public.svc"}
  - {name: KEYCLOAK_REALM, value: "vulnman-staging"}
  - {name: KEYCLOAK_ADMIN_CLIENT_ID, value: vuln-api-admin}
  - {name: VAULT_ADDR, value: "https://vault.vault.svc:8200"}
  - {name: VAULT_ROLE, value: "vuln-api-staging"}
  - {name: TRANSIT_DATA_KEY, value: "vulnman-staging-data"}
  - {name: TRANSIT_REPORT_KEY, value: "vulnman-staging-report"}
  # k3s pod CIDR: X-Forwarded-For is only believed from Traefik's pods.
  - {name: TRUSTED_PROXY_CIDRS, value: "10.42.0.0/16"}
ingress:
  enabled: false
