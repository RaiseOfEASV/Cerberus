# vuln-web, prod - static SPA on nginx-unprivileged (UID 101), same origin
# as vuln-api, so no runtime configuration at all.
image:
  repository: ghcr.io/raiseofeasv/vuln-web
  tag: "0000000000000000000000000000000000000000"
podSecurityContext:
  runAsUser: 101
  runAsGroup: 101
writablePaths:
  - /tmp
  - /var/cache/nginx
ingress:
  enabled: false
