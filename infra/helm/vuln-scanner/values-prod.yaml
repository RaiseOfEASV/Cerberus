# vuln-scanner, prod - nightly Trivy scan (apps/vuln-scanner) as a CronJob
image:
  repository: ghcr.io/raiseofeasv/vuln-scanner
  # tag + digest set by deploy.yml.
  tag: "c8b291db920b68c0432738b48c5bd246c84749bd"
  digest: "sha256:53291661635b739c003ac23bfb6f8d73289fb7e3a28e8f900d8c28aee6f73e30"
serviceAccount:
  create: true
  name: vuln-scanner
kubeApiToken:
  enabled: true
cronJob:
  schedule: "0 2 * * *"
  timeZone: Europe/Copenhagen
  # About 40 catalog images on top of the running ones, some large (Wazuh).
  activeDeadlineSeconds: 10800
writablePaths: [/tmp]
envFromSecrets: [vuln-scanner-token]
resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {cpu: "1", memory: 1536Mi}
env:
  - {name: VULN_API_URL, value: "http://vuln-api.cerberoast.svc"}
  - {name: TRIVY_CACHE_DIR, value: /tmp/trivy-cache}
  - {name: TMPDIR, value: /tmp}
  - {name: HOME, value: /tmp}
  # The image catalog's scan list (docker/images.yaml via scan-images.yaml,
  # added to this release's value files in the prod Application).
  - {name: IMAGES_FILE, value: /etc/app/images.txt}
