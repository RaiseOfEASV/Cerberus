# vuln-scanner, dev - the nightly Trivy scan (apps/vuln-scanner) as a CronJob
# from infra/helm/charts/app. Role, token and network rules are in
# infra/k8s/environments/dev/vulnman.yaml.
image:
  repository: ghcr.io/raiseofeasv/vuln-scanner
  # tag + digest set by deploy.yml (placeholder until the first dev deploy).
  tag: "a8ec3f4bccade11023e157ae48d0bf0de8ae62d9"
  digest: "sha256:5582a1b74077e6c5f6bfcc5f1824b7c912b73b390ade899ee4a685edd1c49237"
serviceAccount:
  create: true
  name: vuln-scanner
kubeApiToken:
  enabled: true
cronJob:
  schedule: "0 2 * * *"
  timeZone: Europe/Copenhagen
  # About 40 catalog images on top of the running ones, some large (Keycloak).
  activeDeadlineSeconds: 10800
# Trivy's database and image layers (about 2 GB at peak).
writablePaths: [/tmp]
envFromSecrets: [vuln-scanner-token]
resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {cpu: "1", memory: 1536Mi}
env:
  - {name: VULN_API_URL, value: "http://vuln-api.dev.svc"}
  - {name: TRIVY_CACHE_DIR, value: /tmp/trivy-cache}
  - {name: TMPDIR, value: /tmp}
  - {name: HOME, value: /tmp}
  # The image catalog's scan list (docker/images.yaml via scan-images.yaml,
  # added to this release's value files in the dev Application) - so the
  # third-party findings can be checked in dev before prod.
  - {name: IMAGES_FILE, value: /etc/app/images.txt}
