# vuln-scanner, staging - nightly Trivy scan (apps/vuln-scanner) as a CronJob
image:
  repository: ghcr.io/raiseofeasv/vuln-scanner
  # tag + digest set by deploy.yml.
  tag: "c93b02e4ede3c3ebf99b8f100d56e9e8ddc0d034"
  digest: "sha256:a39420fd8e8e7422cd49e84f36738d4e3e3ae9d9af25a36e28ae9f412758b4c8"
serviceAccount:
  create: true
  name: vuln-scanner
kubeApiToken:
  enabled: true
cronJob:
  schedule: "0 2 * * *"
  timeZone: Europe/Copenhagen
  activeDeadlineSeconds: 3600
writablePaths: [/tmp]
envFromSecrets: [vuln-scanner-token]
resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {cpu: "1", memory: 1536Mi}
env:
  - {name: VULN_API_URL, value: "http://vuln-api.staging.svc"}
  - {name: TRIVY_CACHE_DIR, value: /tmp/trivy-cache}
  - {name: TMPDIR, value: /tmp}
  - {name: HOME, value: /tmp}
