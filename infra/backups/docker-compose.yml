# Dedicated backup object store (MinIO), separate from everything it
# backs up - the cluster, the three standalone hosts (terraform-state,
# headscale, wazuh). If the cluster is destroyed, the backups must still
# exist somewhere else; putting them anywhere inside what they back up
# would defeat the point. Same "own dedicated host" reasoning as Wazuh's
# manager and headscale.
#
# MinIO (not a shared Postgres like infra/terraform-state/) specifically
# because Velero (the cluster backup tool this epic uses) is built around
# S3-compatible object storage - there's no simpler alternative for that
# consumer the way `pg` backend sidestepped needing MinIO for Terraform
# state.
#
# Root credentials below are for bootstrap only - create a SEPARATE,
# narrowly-scoped MinIO user+policy for actual backup writes (see
# README), per the plan's own wording for this epic: "access-controlled
# separately from general infra access." Don't hand out the root creds to
# every backup source.
#
# Encryption at rest: NOT configured. MinIO's SSE needs a KMS; Vault's
# Transit engine could serve that role but isn't wired up here - flagged
# as a real gap, not silently assumed solved. Relies on whatever disk/
# volume encryption the host provides, same caveat posture as
# infra/terraform-state/'s README.
#
# NOT YET RUNNING: needs a persistent host (same "plain VM for now, Epic
# 5's golden image later" caveat as every other standalone host here).
#
# Image: MinIO pulled its own images from Docker Hub and Quay stopped
# anonymous pulls (project looks abandoned, no official announcement) -
# confirmed by hitting "pull access denied" directly. Using Chainguard's
# community mirror as a stopgap, pinned by digest per this repo's own
# pinning policy. Real risk, not hidden: Chainguard's model generally
# keeps only the rolling `latest` tag free, so if this exact digest ever
# needs re-pulling somewhere it isn't already cached (a fresh clone, a
# rebuilt host) and Chainguard has tightened access by then, it may
# require auth. Revisit - an actively-maintained alternative (Garage,
# SeaweedFS) was considered and deferred, not ruled out.
services:
  minio-backups:
    image: cgr.dev/chainguard/minio@sha256:268d68a2a3b6fc65f905a61f84d7eab6345ce6bff14f551e2b028ec31e6a1341
    restart: unless-stopped
    command: server /data --console-address ":9091"
    environment:
      - MINIO_ROOT_USER=${BACKUP_MINIO_ROOT_USER:?set BACKUP_MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${BACKUP_MINIO_ROOT_PASSWORD:?set BACKUP_MINIO_ROOT_PASSWORD}
    volumes:
      - minio-backups-data:/data
    ports:
      # S3 API - needs to be reachable from the cluster (Velero, the
      # Vault snapshot CronJob) and from the other 3 standalone hosts, so
      # NOT loopback-only like the console below. Put this on the
      # headscale VPN subnet once that's live, not the open internet.
      - "9000:9000"
      # Admin console - loopback only, same posture as every other admin
      # UI in this project.
      - "127.0.0.1:9091:9091"

volumes:
  minio-backups-data:
