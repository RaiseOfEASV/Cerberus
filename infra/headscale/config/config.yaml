# headscale server config. server_url is now the bootstrap VM's real
# public IP (infra/terraform/bootstrap/) - plain HTTP, not HTTPS, because
# nothing on this standalone host terminates TLS yet (cert-manager's
# internal CA only covers in-cluster services). Real gap, not papered
# over: headscale's own auth/registration traffic is unencrypted until
# this gets a cert (e.g. certbot directly on this VM, since it has a
# real public IP, unlike anything behind the internal CA).

server_url: http://4.223.133.113:8080
listen_addr: 0.0.0.0:8080
metrics_listen_addr: 127.0.0.1:9090

# Required since 0.23.0 for the Noise-based protocol (Tailscale v2).
# Written to the data volume (not the read-only config mount) since
# headscale generates this key itself on first run.
noise:
  private_key_path: /var/lib/headscale/noise_private.key

# Standard Tailscale CGNAT ranges - clients won't accept anything outside
# what their own protocol supports, so these aren't arbitrary.
prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
  allocation: sequential

database:
  type: sqlite
  sqlite:
    path: /var/lib/headscale/db.sqlite

derp:
  server:
    enabled: false # relying on the public Tailscale DERP relay fleet for now - self-hosting DERP too is more infra than this needs yet
  urls:
    - https://controlplane.tailscale.com/derpmap/default

dns:
  magic_dns: true
  base_domain: admin.cerberus.internal
  # Static records so VPN-connected clients can resolve each admin UI by
  # name via MagicDNS, without needing a separate DNS server. IPs below
  # are PLACEHOLDERS - fill in with Traefik's actual MetalLB-assigned
  # LoadBalancer IP (see infra/k8s/metallb/ip-address-pool.yaml - also
  # still a placeholder) once that's known; every hostname here resolves
  # to the SAME IP since they're all fronted by one Traefik + oauth2-proxy.
  extra_records:
    - name: "vault.admin.cerberus.internal"
      type: "A"
      value: "CHANGE_ME_TRAEFIK_LB_IP"
    - name: "argocd.admin.cerberus.internal"
      type: "A"
      value: "CHANGE_ME_TRAEFIK_LB_IP"
    - name: "grafana.admin.cerberus.internal"
      type: "A"
      value: "CHANGE_ME_TRAEFIK_LB_IP"
    - name: "wazuh.admin.cerberus.internal"
      type: "A"
      value: "CHANGE_ME_TRAEFIK_LB_IP"
    - name: "kibana.admin.cerberus.internal"
      type: "A"
      value: "CHANGE_ME_TRAEFIK_LB_IP"
    - name: "dependency-track.admin.cerberus.internal"
      type: "A"
      value: "CHANGE_ME_TRAEFIK_LB_IP"
    - name: "keycloak.admin.cerberus.internal"
      type: "A"
      value: "CHANGE_ME_TRAEFIK_LB_IP"

# headscale 0.23.0 moved this under policy.path (flat acl_policy_path is
# a hard FATAL now, not just a deprecation warning - confirmed by hitting
# the crash directly).
policy:
  mode: file
  path: /etc/headscale/acl-policy.hujson
