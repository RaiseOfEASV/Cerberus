# VulnMan realm for prod. Applied by keycloak-config-cli
# (infra/keycloak-public/apply-realm-config.yaml); ${VAR} values come from
# its environment (Vault via ESO) - never write a real secret here.
realm: vulnman
enabled: true
displayName: VulnMan
loginWithEmailAllowed: true
registrationAllowed: false
resetPasswordAllowed: false
bruteForceProtected: true
failureFactor: 5
permanentLockout: false
maxFailureWaitSeconds: 900
passwordPolicy: "length(12) and notUsername"
sslRequired: external
accessTokenLifespan: 300
ssoSessionIdleTimeout: 1800
ssoSessionMaxLifespan: 28800

# AUTH-05 (D17): every prod user enrols TOTP on first login.
otpPolicyType: totp
otpPolicyAlgorithm: HmacSHA1
otpPolicyDigits: 6
otpPolicyPeriod: 30
requiredActions:
  - alias: CONFIGURE_TOTP
    name: Configure OTP
    providerId: CONFIGURE_TOTP
    enabled: true
    defaultAction: true

roles:
  realm:
    - { name: analyst, description: "View, create, update and assign findings" }
    - { name: developer, description: "View findings; update status and details of their own" }
    - { name: pm, description: "Analyst rights plus SLA targets and user roles" }
    - { name: auditor, description: "Read-only: findings, reports, audit trail" }

clients:
  # The app's login client (D2): confidential, code flow only, PKCE required.
  - clientId: vuln-api
    name: VulnMan
    enabled: true
    publicClient: false
    secret: "${VULN_PROD_OIDC_SECRET}"
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    redirectUris: ["https://cerberoast.site/auth/callback"]
    webOrigins: ["+"]
    attributes:
      pkce.code.challenge.method: S256
      post.logout.redirect.uris: "https://cerberoast.site/"
    defaultClientScopes: [openid, profile, email, roles]
  # vuln-api's admin client (D16): service account only, may manage users
  # of THIS realm; the app code only ever touches the four roles above.
  - clientId: vuln-api-admin
    enabled: true
    publicClient: false
    secret: "${VULN_PROD_ADMIN_SECRET}"
    standardFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: true

users:
  - username: service-account-vuln-api-admin
    enabled: true
    serviceAccountClientId: vuln-api-admin
    clientRoles:
      realm-management: [view-users, query-users, manage-users]
