# Local, developer-side secret scanning - catches a secret before it's
# committed at all, not just at PR time via .github/workflows/pr-validate.yml's
# GitGuardian scan job. Both layers are intentional: this one is a courtesy
# (skippable with --no-verify), the CI one is the actual enforced gate.
#
# Setup (one-time, per clone):
#   pip install pre-commit ggshield
#   ggshield auth login          # or: export GITGUARDIAN_API_KEY=...
#   pre-commit install
#
# Renovate keeps `rev` below current via its default pre-commit manager
# (enabled by config:recommended - no renovate.json change needed).
repos:
  - repo: https://github.com/gitguardian/ggshield
    rev: v1.56.0
    hooks:
      - id: ggshield
        language_version: python3
        stages: [pre-commit]
